{% load i18n %}{% load static %}
<form hx-get="{% url 'rec-filter-survey' %}" hx-target="#view-container" id="filterForm">
  <div class="oh-accordion oh-accordion--show">
    <div class="oh-accordion-header">
      <span class="oh-filter-section-icon"><ion-icon name="help-circle-outline"></ion-icon></span>
      {% trans "Survey Filter" %}
    </div>
    <div class="oh-accordion-body">
      <div class="row">
        <div class="col-sm-12 col-md-12 col-lg-12">
          <div class="oh-input-group">
            <label class="oh-label">{% trans "Question" %}</label>
            {{form.question}}
          </div>
        </div>
        <!-- Full width -- Recruitment is now an AJAX-searched Select2
             combobox (see recruitment/filters.py's SurveyFilter.
             ajax_fields) and needs real room for its selected
             chips/placeholder text, same reasoning as every other
             modernized panel this session. -->
        <div class="col-sm-12 col-md-12 col-lg-12">
          <div class="oh-input-group">
            <label class="oh-label">{% trans "Recruitment" %}</label>
            {{form.recruitment_ids}}
          </div>
        </div>
        <div class="col-sm-12 col-md-12 col-lg-6">
          <div class="oh-input-group">
            <label class="oh-label">{% trans "Options" %}</label>
            {{form.options}}
          </div>
        </div>
        <div class="col-sm-12 col-md-12 col-lg-6">
          <div class="oh-input-group">
            <label class="oh-label">{% trans "Question Type" %}</label>
            {{form.type}}
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
<script src="{% static '/base/filter.js' %}"></script>
