{% load i18n generic_template_filters horillafilters %}
{% get_company as theme_obj %}

<style>
    .oh-tabs__tab {
    	padding: 4px 8px;
    	border-radius: 6px;
    	font-size: 0.75rem;
    	display: flex;
    	align-items: center;
    	gap: 0.5rem;
    	transition-property: all;
    	transition-duration: 300ms;
    	border: 1px solid #f6f6f6;
    	color: #1f2937;
    }

    .oh-tabs__tab--active {
    	background-color: {{ theme_obj.primary_300|default:'#fcedeb' }};
    	color: {{ theme_obj.primary_600|default:"#E54F38" }};
    	border: 1px solid {{ theme_obj.primary_600|default:"#E54F38" }};
    }
    .oh-tabs__content {
    	display: none;
    }
    .oh-tabs__content--active {
    	display: block;
    }
    .oh-tabs__tab-scroll {
    	flex-wrap: nowrap;
    	overflow-x: auto;
    	overflow-y: hidden;
    	scrollbar-width: thin;
    }
    .oh-tabs__tab-scroll::-webkit-scrollbar {
    	height: 6px;
    }
    .oh-tabs__tab-scroll::-webkit-scrollbar-thumb {
    	background-color: #d1d5db;
    	border-radius: 6px;
    }
    .oh-tabs__tab-scroll .dropdown-wrapper-tab {
    	flex-shrink: 0;
    }
    .oh-tabs__tab-scroll .oh-tabs__tab {
    	white-space: nowrap;
    }
</style>

{% if not tabs %}
    <div class="flex flex-col items-center justify-center py-10">
        <img src="/static/horilla_theme/assets/img/no-records.svg" alt="" width="300" class="mb-4">
        <p class="text-[#666]">{% trans "No records available at the moment" %}</p>
    </div>
{% else %}
    <div class="flex flex-nowrap items-start gap-2 mb-3">
        <div class="flex gap-1 flex-wrap oh-tabs__tab-scroll min-w-0 flex-1">
            {% for tab in tabs %}
                <div class="relative inline-block dropdown-wrapper-tab">
                    <button
                        class="oh-tabs__tab flex"
                        data-tab-index="{{ forloop.counter0 }}"
                        data-rec-id="{{ tab.rec_id }}"
                        data-target="#pipelinePane{{ tab.rec_id }}"
                        data-tab-url="{{ tab.url }}"
                        data-content-url="{{ tab.content_url }}"
                        data-path="{% url 'cbv-pipeline-tab' %}"
                        onclick="pipelineOpenTab(this)"
                    >
                        <span
                            class="min-w-6 h-6 px-1 bg-primary-600 rounded-full text-white text-xs flex items-center justify-center tab-badge"
                            id="badge-pipelinePane{{ tab.rec_id }}"
                            {% if tab.badge_label %}
                                data-badge-label="{{ tab.badge_label }}"
                                title='{{ tab.badge|default:0 }} {{ tab.badge_label|default:"Items" }}'
                            {% else %}
                                title="{{ tab.badge|default:0 }} {% trans 'Items' %}"
                            {% endif %}
                            onclick="event.stopPropagation()"
                        >
                            {% if tab.badge|default:0 > 999 %}999+{% else %}{{ tab.badge|default:0 }}{% endif %}
                        </span>

                        {{ tab.title }}
                    </button>
                </div>
            {% endfor %}
        </div>
    </div>
{% endif %}

<script>
    function toggleHighlight(checkbox) {
    	if (!checkbox.legth > 0) return;
    	const row = checkbox.closest("tr");
    	if (checkbox.checked) {
    		row.classList.add("highlight");
    	} else {
    		row.classList.remove("highlight");
    	}
    }

    setTimeout(function () {
    	pipelineTabsRendered("{{ active_target|default:''|escapejs }}");
    }, 0);
</script>
