{% extends "index.html" %}
{% block content %}
{% load i18n %}{% load static %}

<style>
    .oh-avatar-stack {
        position: relative;
        display: inline-block;
    }
    .oh-avatar-stack__images {
        display: flex;
        align-items: center;
    }
    .oh-avatar-stack__img {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        margin-left: -10px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: #596376;
        overflow: hidden;
    }
    .oh-avatar-stack__img:first-child {
        margin-left: 0;
    }
    .oh-avatar-stack__img img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
    }
    .oh-avatar-stack__more {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #8c98a8;
        color: #fff;
        font-size: 11px;
        font-weight: 600;
    }
    .oh-avatar-stack__empty {
        color: #8c98a8;
        font-size: 12px;
    }
    .oh-avatar-stack__popover-content {
        display: none;
    }
    /* Shared floating popover: a single body-level element the JS below
       repositions per hover (see the script at the bottom of this file).
       It has to live outside the table -- the cell's ancestor clips
       overflow, so a popover positioned inside it would be invisible. */
    .oh-avatar-float-popover {
        display: none;
        position: fixed;
        z-index: 9999;
        min-width: 180px;
        max-width: 240px;
        max-height: 220px;
        overflow-y: auto;
        padding: 8px;
        background: #fff;
        border: 1px solid #e4e6ea;
        border-radius: 8px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, .12);
    }
    .oh-avatar-stack__popover-title {
        margin-bottom: 6px;
        padding: 0 4px;
        color: #8c98a8;
        font-size: 12px;
        line-height: 16px;
        font-weight: 600;
        text-transform: uppercase;
    }
    .oh-avatar-stack__popover-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px;
        border-radius: 6px;
        color: #2b2b2b;
        font-size: 12px;
        line-height: 16px;
        font-weight: 600;
    }
    .oh-avatar-stack__popover-row:hover {
        background: #f4f6f8;
    }
    .oh-avatar-stack__popover-row .oh-user-panel__remove {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
    }
    .oh-avatar-stack__popover-row img {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
        border-radius: 50%;
        object-fit: cover;
    }
    .oh-avatar-stack__popover-row span {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
</style>

<meta name="csrf-token" content="{{ csrf_token }}">

<div hx-get="{% url 'disciplinary-actions-nav' %}" hx-trigger="load"></div>

{% include "generic/components.html" %}

<div class="oh-checkpoint-badge mb-2" id="selectedInstances" data-ids="[]" data-clicked="" style="display: none"></div>

<div class="oh-wrapper"  id="listContainer">
</div>

<div class="oh-modal" id="dynamicCreateModal" role="dialog" aria-hidden="true" style="z-index: 1022;">
    <div class="oh-modal__dialog" style="max-width: 550px;" id="dynamicCreateModalBody"></div>
</div>

<script>
    function actionTypeChange(selectElement) {
        var selectedActiontype = selectElement.val();
        var parentForm = selectElement.parents().closest("form");
        if (selectedActiontype !== "create" && selectedActiontype) {
            $.ajax({
                type: "post",
                url: "{% url 'action-type-details' %}",
                data: {
                    csrfmiddlewaretoken: getCookie("csrftoken"),
                    action_type: selectedActiontype,
                },
                success: function (response) {
                    // Check if the response.action_type is "suspension"
                    $("[id=id_unit_in]").change(function (e) {
                        e.preventDefault();
                        if (this.value == "days") {
                            parentForm.find("[id=id_days]").parent().parent().show();
                            parentForm.find("[id=id_hours]").parent().parent().hide();
                            parentForm.find("[name=days]").prop("required", true);
                            parentForm.find("[name=hours]").prop("required", false);
                        } else {
                            parentForm.find("[id=id_hours]").parent().parent().show();
                            parentForm.find("[id=id_days]").parent().parent().hide();
                            parentForm.find("[name=days]").prop("required", false);
                            parentForm.find("[name=hours]").prop("required", true);
                        }
                    });
                    if (response.action_type === "suspension") {
                        // Show the 'days' field
                        parentForm.find("[id=id_unit_in]").parent().parent().show();
                        parentForm.find("[id=id_hours]").parent().parent().show();
                        $("[id=id_unit_in]").change();
                    } else {
                        // Hide the 'days' field
                        $("[id=id_unit_in]").change();
                        parentForm.find("[id=id_days]").parent().parent().hide();
                        parentForm.find("[id=id_unit_in]").parent().parent().hide();
                        parentForm.find("[id=id_hours]").parent().parent().hide();
                        parentForm.find("[name=days]").prop("required", false);
                        parentForm.find("[name=hours]").prop("required", false);
                    }
                },
            });
        }
    }

    function actionChange(selectElement) {
        var selectedActiontype = selectElement.val();
        var parentForm = selectElement.parents().closest("form");
        $.ajax({
            type: "post",
            url: "{% url 'action-type-name' %}",
            data: {
                csrfmiddlewaretoken: getCookie("csrftoken"),
                "action_type": selectedActiontype,
            },
            success: function (response) {

                // Check if the response.action_type is "warning"
                if (response.action_type === "warning") {
                    // Hide the 'block_option' field
                    parentForm.find('[id=id_block_option_parent_div]').hide();
                } else {
                    // Show the 'block_option' field
                    parentForm.find('[id=id_block_option_parent_div]').show();
                }

            },
        });
    }

    (function () {
        var floatPop = document.getElementById("disAvatarFloatPopover");
        if (!floatPop) {
            floatPop = document.createElement("div");
            floatPop.id = "disAvatarFloatPopover";
            floatPop.className = "oh-avatar-float-popover";
            document.body.appendChild(floatPop);
        }
        var hideTimer = null;

        function showFor(stack) {
            clearTimeout(hideTimer);
            var src = stack.querySelector(".oh-avatar-stack__popover-content");
            if (!src) {
                return;
            }
            floatPop.innerHTML = src.innerHTML;
            if (window.htmx) htmx.process(floatPop);
            var rect = stack.getBoundingClientRect();
            var pw = 220;
            var left = rect.left;
            if (left + pw > window.innerWidth - 8) {
                left = window.innerWidth - pw - 8;
            }
            var top = rect.bottom + 6;
            if (top + 220 > window.innerHeight - 8) {
                top = rect.top - 226;
            }
            floatPop.style.left = left + "px";
            floatPop.style.top = top + "px";
            floatPop.style.display = "block";
        }

        function scheduleHide() {
            hideTimer = setTimeout(function () {
                floatPop.style.display = "none";
            }, 150);
        }

        document.addEventListener("mouseover", function (e) {
            var stack = e.target.closest && e.target.closest(".oh-avatar-stack");
            if (stack) {
                showFor(stack);
            }
        });
        document.addEventListener("mouseout", function (e) {
            var stack = e.target.closest && e.target.closest(".oh-avatar-stack");
            var toStack = e.relatedTarget && e.relatedTarget.closest
                ? e.relatedTarget.closest(".oh-avatar-stack")
                : null;
            if (stack && stack !== toStack) {
                scheduleHide();
            }
        });
        floatPop.addEventListener("mouseenter", function () {
            clearTimeout(hideTimer);
        });
        floatPop.addEventListener("mouseleave", scheduleHide);
    })();
</script>

{% endblock content %}
