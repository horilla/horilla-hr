            <span class="oh-filter-section-icon"><ion-icon name="ribbon-outline"></ion-icon></span>
            {% trans "Employee Key Result" %}
        </div>
        <div class="oh-accordion-body">
            <div class="row">
                <div class="col-sm-12 col-md-12 col-lg-12">
                    <div class="oh-input-group">
                        <label class="oh-label">{% trans "Status" %}</label>
                        {{ form.status }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
