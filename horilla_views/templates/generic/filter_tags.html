{% load i18n %} {% load basefilters %}

<!-- filter items showing here -->
<div
	class="oh-modal"
	id="savedFilterModal"
	role="dialog"
	aria-labelledby="savedFilterModal"
	aria-hidden="true"
>
	<div
		class="oh-modal__dialog"
		style="max-width: 550px"
		id="SavedFilterFormTarget"
	></div>
</div>
<button
	hx-get='{% url "saved-filter" %}?path={{request.GET.nav_url|default:request.path}}&referrer={{request.META.HTTP_REFERER}}&{{saved_filters.urlencode}}'
	hx-target="#SavedFilterFormTarget"
	hidden
	id="loadsavedfilterform"
></button>
<div style="display: none">{{filter_dict}}</div>

<script type="text/template" class="filter-tags-template">
	{% if filter_dict or nested_fields_active %}
        <span class="oh-titlebar__tag oh-titlebar__tag--custom">
        {% trans 'Filters' %}:
        </span>

        {% if nested_fields_active %}
            {% comment %}
                nested_fields is deliberately excluded from filter_dict below
                (it needs ordered, hierarchical rendering -- "A > B > C", not
                the generic multi-value join) but still needs to show up
                here as a real, clearable filter tag -- the "Grouped by"
                breadcrumb in the view itself covers reconfiguring it, so
                this one just needs a label and a clear (x).
            {% endcomment %}
            <span class="oh-titlebar__tag filter-field" data-field="nested_fields">
                {% trans "Group by" %}: &nbsp
                {% for f in nested_fields_active %}
                    <span class="filter-value">{{ f.1 }}</span>{% if not forloop.last %}<span> &rsaquo; </span>{% endif %}
                {% endfor %}
                <button class="oh-titlebar__tag-close"
                    data-x-field="nested_fields"
                    title="{% trans 'Clear grouping' %}"
                >
                    <ion-icon name="close-outline" class="close-icon"></ion-icon>
                </button>
            </span>
        {% endif %}

        {% for field, values in filter_dict.items %}
            {% if values and field != "path" %}
                <span class="oh-titlebar__tag filter-field" data-field="{{ field }}">
                    {% if field == "field" %}{% trans "Group by" %}{% else %}{{ field|tag_label:filter_tag_labels }}{% endif %}: &nbsp
                    {% if values|length > 3 %}
                        {% comment %}
                            A deep link (e.g. a dashboard tile) can pre-select
                            dozens of values for one field -- spelling all of
                            them out ran them together into one unreadable
                            wall of digits/text instead of a short filter
                            tag. Collapse to a count once there are more than
                            a few, with the full list still available on
                            hover.
                        {% endcomment %}
                        <span
                            class="filter-value"
                            title="{% for value in values %}{{ value|tag_value }}{% if not forloop.last %}, {% endif %}{% endfor %}"
                        >
                            {% blocktrans count counter=values|length %}{{ counter }} selected{% plural %}{{ counter }} selected{% endblocktrans %}
                        </span>
                    {% else %}
                        {% for value in values %}
                            <span class="filter-value" data-value="{{value|tag_value}}">
                            {{value|tag_value}}{% if not forloop.last %},{% endif %}
                            </span>
                        {% endfor %}
                    {% endif %}
                    <button class="oh-titlebar__tag-close"
                        data-x-field="{{ field }}"
                        data-x-extra="{{ field|tag_extra:filter_tag_extras }}"
                    >
                        <ion-icon name="close-outline" class="close-icon"></ion-icon>
                    </button>
                </span>
            {% endif %}
        {% endfor %}

        <button class="oh-titlebar__save"
            id="saveFilterBtn"
            title="{% trans 'Save filter' %}"
        >
            <ion-icon name="bookmark-outline"></ion-icon>
            {% trans "Save" %}
        </button>

        <span class="oh-titlebar__tag oh-titlebar__tag--custom clear-all"
            title="{% trans 'Clear All' %}">
        <ion-icon class="close-icon" name="close-outline"></ion-icon>
        </span>
	{% endif %}
</script>

<script>
	function fieldLabel(value, field) {
		if (`{{keys_to_remove|safe}}`.includes(field)) {
			return "";
		}
		const fiedlElem = $(`#applyFilter`).closest(`form`).find(`[name=${field}]`);
		if (fiedlElem.is("select")) {
			if (fiedlElem.is("select[multiple]")) {
				const optionText = fiedlElem.find(`option[value="${value}"]`).text();
				return optionText || value;
			} else {
				const selectedText = fiedlElem.find("option:selected").text();
				const optionText = fiedlElem.find(`option[value="${value}"]`).text();
				if (selectedText && fiedlElem.val() == value) {
					return selectedText;
				}
				if (optionText) {
					return optionText;
				}
			}
		}
		if (field == "field") {
			return $(`option[value="${value}"]`).html();
		}
		return value;
	}
	$(document).ready(function () {
		const nav = $("#filterTagContainerSectionNav");

		// Fix HTMX ID Collision: always grab the last injected template in the DOM
		// so we don't accidentally grab the empty template from the initial page load!
		const template = $(".filter-tags-template").last().html();
		nav.html(template);

		// Events (clean separation)
		nav.on("click", ".oh-titlebar__tag-close", function () {
			clearFilterFromTag($(this));
		});

		nav.on("click", ".clear-all", function () {
			clearAllFilter($(this));
		});

		$("#saveFilterBtn").on("click", function () {
			$("#loadsavedfilterform").click();
			$("#savedFilterModal").addClass("oh-modal--show");
		});

		$(".filter-field").each(function () {
			var field = $(this).attr("data-field");
			$(this)
				.find(".filter-value")
				.each(function () {
					var value = $(this).attr("data-value");
					var labelText = fieldLabel(value, field);
					if (labelText) {
						$(this).text(labelText);
					}
				});
		});
	});
</script>
<div
	id="filterTagContainerSectionNav"
	class="oh-titlebar-container__filters mb-2 mt-0 oh-wrapper"
></div>
