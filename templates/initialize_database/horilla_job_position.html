{% load i18n %}
<div class="oh-onboarding-card__header">
    <span class="oh-onboarding-card__company-name">{% trans "Horilla HRMS" %}</span>
    <ul class="oh-onboarding-card__steps">
        <li class="oh-onboarding-card__step">
            <div class="oh-onboarding-card__count">1</div>
            <span class="oh-onboarding-card__text">{% trans "Sign Up" %}</span>
        </li>
        <li class="oh-onboarding-card__step">
            <div class="oh-onboarding-card__count">2</div>
            <span class="oh-onboarding-card__text">{% trans "Company" %}</span>
        </li>
        <li class="oh-onboarding-card__step">
            <div class="oh-onboarding-card__count">3</div>
            <span class="oh-onboarding-card__text">{% trans "Department" %}</span>
        </li>
        <li class="oh-onboarding-card__step oh-onboarding-card__step--active">
            <div class="oh-onboarding-card__count">4</div>
            <span class="oh-onboarding-card__text">{% trans "Job Position" %}</span>
        </li>
    </ul>
</div>
<div class="d-flex justify-content-end mt-3">
    <a href="" onclick="window.location.reload(); return false;" class="oh-onboarding-skip" style="color: #e54f38; font-weight: 500; text-decoration: none;">
        {% trans "Skip" %} <ion-icon name="arrow-forward-outline" style="vertical-align: middle;"></ion-icon>
    </a>
</div>
<h1 class="oh-onboarding-card__title oh-onboarding-card__title--h2 text-center my-3">
    {% trans "Job Position" %}
</h1>
{% include "initialize_database/horilla_job_position_form.html" %}
