{% load i18n %}
<div class="oh-modal" id="deactivateModal">
    <div class="oh-modal__dialog">
        <div class="oh-modal__dialog-header">
            <h4>{% trans "Deactivate Company" %}</h4>
        </div>
        <form
            method="post"
            action="{% url 'company-onboarding-deactivate' company_id=company.pk %}"
            id="deactivateForm"
        >
            {% csrf_token %}
            <div class="oh-modal__dialog-body">
                <div class="oh-input-group mb-2">
                    <label class="oh-label">{% trans "Reason" %}</label>
                    <textarea
                        name="reason"
                        class="oh-input w-100"
                        placeholder="{% trans 'Reason for deactivation (required)' %}"
                        required
                    ></textarea>
                </div>

                <p class="oh-label mt-3 mb-1">{% trans "Confirm the following before deactivating:" %}</p>
                <ul class="list-unstyled">
                    <li class="py-1"><label class="d-flex align-items-center gap-2"><input type="checkbox" class="deactivate-checklist-item" name="invoices_reconciled"> {% trans "All invoices reconciled and outstanding dues collected" %}</label></li>
                    <li class="py-1"><label class="d-flex align-items-center gap-2"><input type="checkbox" class="deactivate-checklist-item" name="advances_collected"> {% trans "Advances collected for salary processing" %}</label></li>
                    <li class="py-1"><label class="d-flex align-items-center gap-2"><input type="checkbox" class="deactivate-checklist-item" name="employees_transferred_or_terminated"> {% trans "Employees processed as Transfer or Termination" %}</label></li>
                    <li class="py-1"><label class="d-flex align-items-center gap-2"><input type="checkbox" class="deactivate-checklist-item" name="compliances_closed"> {% trans "Compliances closed (PF, ESI, PT, LWD, TDS)" %}</label></li>
                    <li class="py-1"><label class="d-flex align-items-center gap-2"><input type="checkbox" class="deactivate-checklist-item" name="employees_removed_from_insurance"> {% trans "Employees removed from insurance" %}</label></li>
                    <li class="py-1"><label class="d-flex align-items-center gap-2"><input type="checkbox" class="deactivate-checklist-item" name="employees_deactivated_from_hrms"> {% trans "Employees deactivated from HRMS" %}</label></li>
                    <li class="py-1"><label class="d-flex align-items-center gap-2"><input type="checkbox" class="deactivate-checklist-item" name="data_handed_over"> {% trans "Data handed over to new employer/client" %}</label></li>
                </ul>
            </div>
            <div class="oh-modal__dialog-footer">
                <button type="submit" id="confirmDeactivateBtn" class="oh-btn oh-btn--danger" disabled>
                    {% trans "Confirm Deactivate" %}
                </button>
            </div>
        </form>
    </div>
</div>
<script>
    (function () {
        var checkboxes = document.querySelectorAll(".deactivate-checklist-item");
        var confirmBtn = document.getElementById("confirmDeactivateBtn");
        function refresh() {
            var allChecked = Array.prototype.every.call(checkboxes, function (cb) {
                return cb.checked;
            });
            confirmBtn.disabled = !allChecked;
        }
        checkboxes.forEach(function (cb) {
            cb.addEventListener("change", refresh);
        });
    })();
</script>
