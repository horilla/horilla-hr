{% load horillafilters i18n %}
<div>
    {% include "generic/horilla_form.html" %}
</div>

{{ attachment_required_type_ids|json_script:"attachmentRequiredTypeIds" }}
<script>
    (function () {
        var requiredIds = JSON.parse(
            document.getElementById("attachmentRequiredTypeIds").textContent
        ).map(String);
        var hasExisting = {{ has_existing_attachment|yesno:"true,false" }};

        function syncAttachmentRequired() {
            var $form = $("#createTitle").closest("form");
            var typeVal = String($form.find("[name=leave_type_id]").val() || "");
            var needed = requiredIds.indexOf(typeVal) !== -1;
            $form.find("label[for=id_attachment]").toggleClass("required-star", needed);
            $form.find("[name=attachment]").prop("required", needed && !hasExisting);
        }

        $(document).on("change", "[name=leave_type_id]", syncAttachmentRequired);
        $(document).on("htmx:afterSwap", function (e) {
            if (e.target && e.target.id === "id_leave_type_id_parent_div") {
                syncAttachmentRequired();
            }
        });
        $(document).ready(syncAttachmentRequired);
        syncAttachmentRequired();
    })();
</script>
<script>
    $("#createTitle").on("htmx:beforeSwap",function(e){
        $('.available-leave-count').remove();
    });
</script>
<script>
    $(document).ready(function () {
        var $leaveType = $("#createTitle").closest("form").find("[name=leave_type_id]");
        if ($leaveType.length && $leaveType.val()) {
            $leaveType[0].dispatchEvent(new Event("change"));
        }
    });
</script>
<script>
    $(document).on("htmx:afterSwap", function (e) {
        if (e.target && e.target.id === "id_leave_type_id_parent_div") {
            $('.available-leave-count').remove();
            var $leaveType = $(e.target).find("[name=leave_type_id]");
            if ($leaveType.length) {
                $leaveType[0].dispatchEvent(new Event("change"));
            }
        }
    });
</script>
<script>
    var test = $("#createTitle").closest("form")
    test.find("button[type=submit]").hide();
    var button = `
    <div class="oh-modal__dialog-footer p-0 mt-3">
      <button type="button" id="buttonID" class="oh-btn oh-btn--secondary oh-btn--shadow">{% trans 'Save'|escapejs %}</button>
    </div>
    `;
    test.find(".d-flex").after(button);

    $("#buttonID").on("click", function (event) {
        var zeroDaysFlag = $("#requestedDaysZeroFlag").val();
        if (zeroDaysFlag === "true") {
            event.stopImmediatePropagation();
            Swal.fire({
                title: "{% trans 'Cannot submit leave request'|escapejs %}",
                text: "{% trans 'The selected dates result in 0 leave days for this leave type. Please adjust the dates, breakdown or leave type.'|escapejs %}",
                icon: "warning",
                confirmButtonText: "{% trans 'OK'|escapejs %}",
            });
            return false;
        }

        {% if not "recruitment"|app_installed %}
            test.find("[type=submit]:not([name=save_and_add_another])").click();
        {% endif %}
    });

    {% if "recruitment"|app_installed %}
    $(document).ready(function () {
        $("#buttonID").on("click", function (event) {
            var startDate = test.find("[name=start_date]").val();
            var endDate = test.find("[name=end_date]").val();
            var parentForm = $(this).closest('form');
            var employee = parentForm.find('[name="employee_id"]').val()
            var employeeName = parentForm.find('[name="employee_id"] option:selected').text();
            $.ajax({
                type: "GET",
                url: "{% url 'check-interview-conflicts' %}",
                data: {
                    start_date: startDate,
                    end_date: endDate,
                    employee_id: employee,
                },
                success: function (response) {
                    var interviews = response.interviews;
                    title = "{% trans 'Leave Request Alert.'|escapejs %}";
                    var content = `<div>
                        <p>${employeeName} {% trans "has interview in the requested date."|escapejs %}</p>
                        <ol style="margin-left:5%">`;
                            interviews.forEach(function (interview, index) {
                                content += `<li style="text-align:left; font-size:14px">${interview}</li>`;
                            });
                            content += `</ol>
                            <p style="font-weight:700">{% trans "Are you sure you want to proceed with the request?"|escapejs %}</p>
                        </div>`;

                        if (interviews.length != 0) {
                            Swal.fire({
                                title: title,
                                icon: "info",
                                html: content,
                                showCancelButton: true,
                                confirmButtonColor: "#008000",
                                cancelButtonColor: "#6c757d",
                                confirmButtonText: i18nMessages.confirm,
                            }).then(function (result) {
                                if (result.isConfirmed) {
                                    test.find("[type=submit]:not([name=save_and_add_another])").show();
                                    $("#buttonID").hide();
                                test.find("[type=submit]:not([name=save_and_add_another])").click();
                            }
                        });
                    } else {
                        test.find("[type=submit]:not([name=save_and_add_another])").click();
                    }
                },
            });
        });
    });
    {% endif %}
</script>
