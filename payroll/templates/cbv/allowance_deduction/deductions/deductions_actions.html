{% load i18n %}
{% if perms.payroll.change_deduction or perms.payroll.delete_deduction %}
    <div class="">
      <div class="flex items-center justify-center gap-1">
    {% if perms.payroll.view_payslip %}
        <a
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
            href="{% url 'payroll-component-report-detail' 'deduction' instance.id %}"
            onclick="event.stopPropagation();"
            title="{% trans 'Report' %}"
        >
            <ion-icon
                name="bar-chart-outline"
                role="img"
                class="md hydrated"
            ></ion-icon>
        </a>
    {% endif %}
        {% if perms.payroll.change_deduction %}
        <a
          onclick="event.stopPropagation();"
          class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
          href="#"
          hx-get="{% url 'update-deduction' instance.id %}"
          hx-target="#listContainer"
          hx-swap="innerHTML"
          title="{% trans 'Update' %}"
          >
          <ion-icon
            name="create-outline"
            role="img"
            class="md hydrated"
            style="color: blue"
            aria-label="{% trans 'create outline' %}"
          ></ion-icon>
        </a>
        {% endif %}
        {% if perms.payroll.delete_deduction %}
        <a
          class="oh-btn oh-btn--danger oh-btn--sq-sm"
          onclick = "event.preventDefault();event.stopPropagation();"
          hx-get="{% url 'generic-delete' %}?model=payroll.Deduction&pk={{instance.id}}"
          hx-target="#deleteConfirmationBody" data-toggle="oh-modal-toggle"
          data-target="#deleteConfirmation"
          title="{% trans 'Delete' %}"
          >
          <ion-icon
            name="trash-outline"
            role="img"
            class="md hydrated"
            aria-label="{% trans 'trash outline' %}"
          ></ion-icon>
        </a>
        {% endif %}
      </div>
    </div>
{% endif %}
