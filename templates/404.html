{% load static i18n %}

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    * {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
    }

    .hr-error {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        text-align: center;
    }

    .hr-error_container {
        display: flex;
        align-items: center;
        justify-content: space-around;
        width: 100%;
        max-width: 1180px;
        margin-right: auto;
        margin-left: auto;
        padding-top: 3rem;
        padding-bottom: 3rem;
    }

    .hr-404 {
        margin-bottom: 0;
        font-size: 7rem;
        line-height: 7.2rem;
    }

    .hr-error_msg {
        color: #3535C8;
        font-weight: bold;
        font-size: 2rem;
    }

    .hr-error_btn {
        display: inline-flex;
        align-items: center;
        margin-top: 2rem;
        padding: 0.5rem 2rem;
        gap: 0.8rem;
        border: 2px solid hsl(8deg, 77%, 56%);
        border-radius: 35px;
        background-color: hsl(8deg, 77%, 56%);
        color: hsl(0deg, 0%, 100%);
        font-size: 1rem;
        text-decoration: none;
        transition: all 0.4s ease-in-out;
    }

    .hr-error_btn:hover {
        border: 2px solid hsl(8deg, 77%, 45%);
        background-color: hsl(8deg, 77%, 45%);
        color: hsl(0deg, 0%, 100%);
    }

    .hr-error_img img {
        width: 100%;
        height: 100%;
    }

    .hr-error_bg {
        position: relative;
        width: 340px;
        height: 340px;
        border-radius: 50%;
        background-color: #3535C8;
        box-shadow: rgb(0 0 0 / 26%) 0px 4px 4px;
    }

    .hr-error_bg img {
        position: absolute;
        top: 40px;
        left: 0;
    }
    .hr-bg-img--error {
        position: relative;
        max-width: 320px;
    }

    @media (max-width: 768px) {
        .hr-error_container {
            flex-direction: column-reverse;
            text-align: center;
        }

        .hr-error_bg {
            position: relative;
            width: 320px;
            height: 320px;
            background-color: #3535C8;
        }

        .hr-error_content {
            padding: 2rem 0;
        }
    }

    .oh-alert-container {
        z-index: 9999 !important;
        position: fixed;
        top: 75px;
        right: 2rem;
        width: 95%;
        max-width: 500px;
        pointer-events: none;
    }

    @media (max-width: 575.98px) {
        .oh-alert-container {
            right: auto;
            left: auto;
            width: 95%;
        }
    }

    .oh-alert {
        display: flex;
        align-items: center;
        width: 100%;
        margin-bottom: 0.75rem;
        padding: 1rem;
        background-color: hsl(0, 0%, 100%);
        box-shadow: rgba(0, 0, 0, 0.04) 0px 3px 5px;
        font-size: 0.85rem;
        opacity: 0;
    }

    .oh-alert:last-child {
        margin-bottom: 0;
    }

    .oh-alert::before {
        display: inline-block;
        position: relative;
        width: 24px;
        height: 24px;
        margin-right: 0.75rem;
        background-size: contain;
        background-repeat: no-repeat;
        content: '';
    }

    .oh-alert--animated {
        animation: slide-right-in-pop-animation 3.5s 0s ease-in-out forwards;
    }

    @keyframes slide-right-in-pop-animation {
        0% {
            visibility: hidden;
            transform: translate3d(100%, 0, 0);
            opacity: 0;
        }

        30% {
            visibility: visible;
            transform: translate3d(0, 0, 0);
            opacity: 1;
        }

        80% {
            visibility: visible;
            transform: translate3d(0, 0, 0);
            opacity: 1;
        }

        100% {
            visibility: hidden;
            transform: translate3d(-10%, 0, 0);
            opacity: 0;
        }
    }

    .oh-alert--danger {
        border: 1px solid hsl(357, 72%, 89%);
        border-left: 5px solid hsl(0, 71%, 54%);
        background-color: hsl(0, 75%, 97%);
    }

    }

    .oh-alert--warning {

    }

    .oh-alert--info {
        border: 1px solid hsl(218, 75%, 87%);
        border-left: 5px solid hsl(225, 72%, 48%);
        background-color: hsl(212, 89%, 96%);
    }

    .oh-alert--info::before {
        background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDYiIGhlaWdodD0iNDYiIGZpbGw9IiMwNDQ0Y2UiIHZpZXdCb3g9IjAgMCAyNCAyNCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8cGF0aCBkPSJNMTIgMi4yNWMtNS4zNzYgMC05Ljc1IDQuMzc0LTkuNzUgOS43NXM0LjM3NCA5Ljc1IDkuNzUgOS43NSA5Ljc1LTQuMzc0IDkuNzUtOS43NVMxNy4zNzYgMi4yNSAxMiAyLjI1Wm0uOTM4IDE0Ljk5NmgtMS44NzZWMTUuMzdoMS44NzZ2MS44NzVabS0uMTg4LTIuOTk2aC0xLjVsLS4yODEtNy41aDIuMDYybC0uMjgxIDcuNVoiPjwvcGF0aD4KPC9zdmc+');
    }

    .oh-alert--success {
        border: 1px solid hsl(136, 51%, 84%);
        border-left: 5px solid hsl(119, 39.1304347826%, 46%);
        background-color: hsl(137, 78%, 93%);
    }

    .oh-alert--success::before {
        background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDYiIGhlaWdodD0iNDYiIGZpbGw9IiM0OWEyNDgiIHZpZXdCb3g9IjAgMCAyNCAyNCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8cGF0aCBkPSJNMTIgMi4yNWMtNS4zNzYgMC05Ljc1IDQuMzc0LTkuNzUgOS43NXM0LjM3NCA5Ljc1IDkuNzUgOS43NSA5Ljc1LTQuMzc0IDkuNzUtOS43NVMxNy4zNzYgMi4yNSAxMiAyLjI1Wm0uOTM4IDE0Ljk5NmgtMS44NzZWMTUuMzdoMS44NzZ2MS44NzVabS0uMTg4LTIuOTk2aC0xLjVsLS4yODEtNy41aDIuMDYybC0uMjgxIDcuNVoiPjwvcGF0aD4KPC9zdmc+');
    }
</style>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% trans "Krew" %}</title>
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="{% if white_label_company.icon %}{{white_label_company.icon.url}} {% else %}{% static 'favicons/favicon-32x32.png' %}{% endif %}"
        >
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="{% if white_label_company.icon %}{{white_label_company.icon.url}} {% else %}{% static 'favicons/favicon-16x16.png' %}{% endif %}"
        >
    </head>

    <body>
        {% if messages %}
            <div class="oh-wrapper">
                {% for message in messages %}
                    <div class="oh-alert-container">
                        <div class="oh-alert oh-alert--animated {{message.tags}}">
                            {{ message }}
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        <section class="hr-error_container">
            <div class="hr-error">
                <div class="hr-error_img hr-error_bg">
                    <img src='{% static "/images/ui/404_error_image.png" %}'>
                </div>
                <div>
                    <h1 class="hr-404">404</h1>
                    <p class="hr-error_msg">{% trans "Page not found!" %}</p>
                    <p>{% trans "Oops! The page you are looking for could not be found." %}</p>
                    <a href="/" class="hr-error_btn"><ion-icon
                            name="arrow-back-outline"
                        ></ion-icon>{% trans "Return to the main page" %}</a>
                </div>
            </div>
        </section>

        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    </body>
</html>
