{% load static i18n %}
{% if perms.payroll.change_contract %}
    <!-- Start of Edit a Tag -->
    <a
        href="#"
        hx-get="{% url 'update-contract' instance.id %}"
        hx-target="#relatedObjectModalBody"
        data-toggle="oh-modal-toggle"
        data-target="#relatedObjectModal"
        hx-on:click="$(this).closest('.oh-modal--show').removeClass('oh-modal--show');"
        class="oh-btn oh-btn--light-bkg w-24 px-4 py-2 rounded-md text-xs flex items-center justify-center gap-2 transition duration-300"
    >
        <ion-icon name="create-outline"></ion-icon>
        {% trans 'Edit' %}
    </a>
    <!-- End of Edit a Tag -->
{% endif %}

{% if perms.payroll.delete_contract %}
    <!-- Start of Delete Form -->
    <form
        hx-confirm="{% trans 'Do you want to delete this Contract?' %}"
        hx-post="{% url 'delete-contract-modal' instance.id %}?{{pd}}"
        hx-target="{{delete_hx_target}}"
    >
        {% csrf_token %}
        <button
            data-action="delete"
            type="submit"
            class="oh-btn oh-btn--danger w-24 px-4 py-2 rounded-md text-xs flex items-center justify-center gap-2 transition duration-300"
        >
            <img
                src="{% static 'horilla_theme/assets/img/icons/trash.svg' %}"
                alt="{% trans 'Delete' %}"
                width="16"
                class="mt-[-1px] filter brightness-0 invert"
            >
            {% trans 'Delete' %}
        </button>
    </form>
    <!-- End of Delete Form -->
{% endif %}
