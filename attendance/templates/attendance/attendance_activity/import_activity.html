{% load i18n %}
<div class="oh-modal__dialog-header">
    <h2 class="oh-modal__dialog-title" id="activityImportLabel">
        {% trans "Import Check-in / Check-out Log" %}
    </h2>

    <button class="oh-modal__close" aria-label="{% trans 'Close' %}">
        <ion-icon name="close-outline"></ion-icon>
    </button>
</div>

<div class="oh-modal__dialog-body" id="activityImportModalBody">
    <form
        hx-post="{% url 'attendance-activity-import' %}"
        hx-encoding="multipart/form-data"
        hx-target="#objectCreateModalTarget"
        hx-swap="outerHTML"
        hx-timeout="600000"
        hx-indicator="#uploading"
        class="oh-profile-section"
        id="activityImportForm"
    >
        {% csrf_token %}
        <div id="uploading" class="oh-upload-loader" role="status" aria-live="polite">
            <p class="oh-upload-loader__title">{% trans "Uploading..." %}</p>
            <p class="oh-upload-loader__hint">{% trans "Don't refresh the page" %}</p>
            <div class="oh-upload-loader__bar"><span></span></div>
        </div>

        <div id="uploadContainer">
            <label for="uploadFile" class="oh-dropdown__import-label">
                <ion-icon name="cloud-upload" class="oh-dropdown__import-form-icon"></ion-icon>
                <span class="oh-dropdown__import-form-title">{% trans "Upload a File" %}</span>
                <span class="oh-dropdown__import-form-text">{% trans "Drag and drop files here" %}</span>
            </label>
            <input type="file" name="activity_import" required>
            <div class="float-end">
                <a href="{% url 'attendance-activity-import-excel' %}" class="oh-dropdown__link" download>
                    <ion-icon name="cloud-download-outline"></ion-icon>
                    <span>{% trans "Download Template" %}</span>
                </a>
            </div>
            <button type="submit">{% trans "Upload" %}</button>
        </div>
    </form>
</div>

<script>
    $(document).ready(function () {
        Swal.fire({
            text: "{% trans 'Do you want to download the template?'|escapejs %}",
            icon: "question",
            showCancelButton: true,
            confirmButtonColor: "#008000",
            cancelButtonColor: "#6c757d",
            confirmButtonText: "{% trans 'Confirm'|escapejs %}"
        }).then((result) => {
            if (result.isConfirmed) {
                $.ajax({
                    type: "GET",
                    url: "{% url 'attendance-activity-import-excel' %}",
                    xhrFields: { responseType: "blob" },
                    success: function (response) {
                        const url = URL.createObjectURL(new Blob([response], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
                        const link = document.createElement("a");
                        link.href = url;
                        link.download = "activity_excel.xlsx";
                        document.body.appendChild(link);
                        link.click();
                        URL.revokeObjectURL(url);
                    },
                    error: function () {
                        console.error("{% trans 'Error downloading file'|escapejs %}");
                    }
                });
            }
        });
    });
</script>
