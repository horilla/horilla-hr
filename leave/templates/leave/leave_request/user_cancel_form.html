{% load i18n %}
{% if form.errors %}
    <!-- form errors  -->
    <div class="oh-wrapper">
        <div class="oh-alert-container">
            {% for error in form.non_field_errors %}
                <div class="oh-alert oh-alert--animated oh-alert--danger">{{ error }}</div>
            {% endfor %}
        </div>
    </div>
{% endif %}
<div class="oh-modal__dialog-header">
    <h2 class="oh-modal__dialog-title" id="editModal1ModalLabel">
        {% trans "Request Cancellation" %}
    </h2>
    <button class="oh-modal__close" aria-label="{% trans 'Close' %}">
        <ion-icon name="close-outline"></ion-icon>
    </button>
</div>
<div class="oh-modal__dialog-body">
    <form
        hx-post="{% url 'user-request-cancel' id %}"
        hx-confirm="{% trans 'Submit a cancellation request to your manager? The leave stays approved until it is accepted.' %}"
        hx-encoding="multipart/form-data"
    >
        <div class="oh-general__tab-target oh-profile-section">
            <div class="col-sm-12 col-md-12 col-lg-12">
                <div>{{ form.reason }}</div>
                {{ form.errors }}
            </div>
            <div class="d-flex flex-row-reverse">
                <button
                    type="submit"
                    class="oh-btn oh-btn--secondary oh-btn--shadow mt-3"
                >
                    {% trans "Submit" %}
                </button>
            </div>
        </div>
    </form>
</div>
