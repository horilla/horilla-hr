{% load i18n static %}

<div class="oh-inner-sidebar-content border border-[#ebebeb] rounded-md mb-5">
    <div hx-get="{% url 'requests-shift-inbox-nav' %}{% if request.GET %}?{{ request.GET.urlencode }}{% endif %}" hx-trigger="load"></div>

    <p class="text-xs text-gray-500 mt-1 ml-2">
        {% trans "Requests from colleagues asking you to cover or take over their shifts." %}
    </p>

    <div
        class="oh-checkpoint-badge mb-2"
        id="allocatedselectedInstances"
        data-ids="[]"
        data-clicked=""
        style="display: none"
    >
    </div>

    <div class="oh-wrapper" id="listContainer">
    </div>

    <div class="oh-activity-sidebar" id="activitySidebar" style="z-index: 1000">
        <div class="oh-activity-sidebar__body" id="commentContainer"></div>
    </div>
</div>

<script src="{% static 'cbv/shift_request/shift_request_bulk_actions.js' %}"></script>
