{% load i18n %}
{% if perms.payroll.change_allowance or perms.payroll.delete_allowance %}
    <div class="oh-sticky-table__right">
        <div class="flex items-center justify-center gap-1">
    {% if perms.payroll.view_payslip %}
        <a
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
            href="{% url 'payroll-component-report-detail' 'allowance' instance.id %}"
            onclick="event.stopPropagation();"
            title="{% trans 'Report' %}"
        >
            <ion-icon
                name="bar-chart-outline"
                role="img"
                class="md hydrated"
            ></ion-icon>
        </a>
    {% endif %}
            {% if perms.payroll.change_allowance %}
                <a onclick="event.stopPropagation();" class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
                    href="#"
                    hx-get="{% url 'update-allowance' instance.id %}"
                    hx-target="#listContainer"
                    hx-swap="innerHTML"
                    title='{% trans "Update" %}'>
                    <ion-icon name="create-outline" role="img" class="md hydrated" style="color: blue"
                    aria-label="{% trans 'create outline' %}"></ion-icon>
                </a>
            {% endif %}
            {% if perms.payroll.delete_allowance %}
                <a class="oh-btn oh-btn--danger oh-btn--sq-sm"
                    onclick = "event.preventDefault();event.stopPropagation();"
                    hx-get="{% url 'generic-delete' %}?model=payroll.Allowance&pk={{instance.id}}"
                    hx-target="#deleteConfirmationBody" data-toggle="oh-modal-toggle"
                    data-target="#deleteConfirmation"
                    itle="{% trans 'Delete' %}">
                    <ion-icon name="trash-outline" role="img" class="md hydrated"
                        aria-label="{% trans 'trash outline' %}" >
                    </ion-icon>
                </a>
            {% endif %}
        </div>
    </div>
{% endif %}
{% if request.GET.deleted %}
    <script>
    $("#reloadMessagesButton").click()
    </script>
{% endif %}
