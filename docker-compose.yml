# Development Compose stack for Horilla HR.
# Zero-config: `make dev` / `docker compose up --build`
# Production: `make prod` (uses docker-compose.prod.yml + .env — see .env.dist)
#
# Dev secrets below are intentionally weak and for local use only.
# Replaces the legacy docker-compose.yaml (Python 3.10 / runserver) stack.

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
      - media:/app/media
    environment:
      - DEBUG=1
      - DB_HOST=db
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000
      - DATABASE_URL=postgres://horilla_user:horilla_pass@db:5432/horilla_db
      - DB_INIT_PASSWORD=dev-init-password-change-in-production
      - REDIS_URL=redis://:horilla_pass@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 30s
      start_period: 60s
      retries: 3

  # Background jobs. Registered via horilla.scheduling.register_job and run by
  # exactly ONE process -- keep this at a single replica. Jobs used to start
  # inside every gunicorn worker, so payroll runs and backups fired once per
  # worker per interval.
  #
  # HORILLA_SKIP_RELEASE_TASKS=1 because the web container already runs migrate
  # and collectstatic on boot; running them here too would race it, and
  # collectstatic --clear would wipe STATIC_ROOT from under the live web
  # container.
  scheduler:
    build: .
    command: ["python", "manage.py", "run_scheduler"]
    volumes:
      - .:/app
      - media:/app/media
    environment:
      - DEBUG=1
      - DB_HOST=db
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - DATABASE_URL=postgres://horilla_user:horilla_pass@db:5432/horilla_db
      - DB_INIT_PASSWORD=dev-init-password-change-in-production
      - REDIS_URL=redis://:horilla_pass@redis:6379/0
      - HORILLA_SKIP_RELEASE_TASKS=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horilla_db
      POSTGRES_USER: horilla_user
      POSTGRES_PASSWORD: horilla_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horilla_user -d horilla_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass horilla_pass
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "horilla_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      # Static only — /media/ is proxied to Django (protected_media). Do not
      # mount the media volume here; an alias location would bypass auth.
      - staticfiles:/static:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    profiles: ["production"]

volumes:
  staticfiles:
  media:
  postgres_data:
  redis_data:
