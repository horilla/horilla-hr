{% load i18n horillafilters %}
{% get_company as theme_obj %}
<div id="exportModalWrap{{view_id|safe}}">
    <div
        class="oh-modal"
        id="exportFields{{view_id|safe}}"
        role="dialog"
        aria-labelledby="exportFields{{view_id|safe}}"
        aria-hidden="true"
    >
        <div class="oh-modal__dialog" id="exportFields{{view_id|safe}}">
            <div class="oh-modal__dialog-header">
                <h2
                    class="oh-modal__dialog-title"
                    id="exportModalLable{{view_id|safe}}"
                >
                    {% trans "Export" %} {{ verbose_name }}
                </h2>
                <button
                    onclick="$(this)
              .closest('.oh-modal--show')
              .removeClass('oh-modal--show')"
                    class="oh-modal__close"
                    aria-label="{% trans 'Close' %}"
                >
                    <ion-icon name="close-outline"></ion-icon>
                </button>
            </div>
            <div class="oh-modal__dialog-body">
                <form
                    method="post"
                    action="{{export_path}}"
                    onsubmit="const selectedFields = $('#{{view_id|safe}} input[name=selected_fields]:checked').map(function() {
                return [[$(this).attr('data-label'),this.value]];
            }).get();
            selectedIds = $('#{{selected_instances_key_id}}').attr('data-ids');
            $(this).find('[name=ids]').val(selectedIds);
            $(this).find('[name=columns]').val(JSON.stringify(selectedFields))"
                    id="candidateExportForm"
                >
                    {% csrf_token %}
                    <input type="hidden" name="ids" id="{{view_id}}ExportIds">
                    <input
                        type="hidden"
                        name="columns"
                        id="{{view_id}}ExportColumns"
                    >

                    <div class="hlv-export-options" style="display:grid;grid-template-columns:2fr 1fr;gap:16px;margin:0 0 16px">
                        <div>
                            <label for="{{view_id|safe}}ExportName" style="display:block;margin-bottom:4px;font-size:13px;color:#6b7280;">{% trans "File name" %}</label>
                            <input
                                type="text"
                                id="{{view_id|safe}}ExportName"
                                name="export_file_name"
                                value="{{view.export_file_name}}"
                                maxlength="100"
                                autocomplete="off"
                                placeholder="{% trans 'Leave blank for the default name' %}"
                                style="width:100%;box-sizing:border-box;height:38px;border:1px solid #e5e7eb;border-radius:6px;padding:8px 10px;font-size:14px;background:#fff;color:#374151;outline:none;"
                            >
                        </div>
                        <div>
                            <label for="{{view_id|safe}}ExportFormat" style="display:block;margin-bottom:4px;font-size:13px;color:#6b7280;">{% trans "Format" %}</label>
                            <select
                                id="{{view_id|safe}}ExportFormat"
                                name="format"
                                style="width:100%;box-sizing:border-box;height:38px;border:1px solid #e5e7eb;border-radius:6px;padding:8px 10px;font-size:14px;background:#fff;color:#374151;outline:none;"
                            >
                                {% for format in export_formats %}
                                    <option value="{{format.0}}">{{ format.1 }} (.{{ format.0 }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-12 col-md-12 col-lg-12">
                            <div
                                class="oh-input-group d-flex justify-content-between"
                                style="align-items: center"
                            >
                                <label class="oh-label"
                                >
                                    <input
                                        type="checkbox"
                                        id="select-all-export-fields"
                                        onchange="$(this)
                        .closest('form')
                        .find('input[name=selected_fields]')
                        .prop(
                          'checked',
                          $(this).is(':checked'),
                        )
                        .change()"
                                    >
                                    {% trans "Select All" %}
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        {% for col in export_columns %}
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <div class="oh-input-group">
                                    <label class="oh-label">
                                        <label for="col_{{col.1}}"><input
                                                type="checkbox"
                                                data-label="{{col.0}}"
                                                name="selected_fields"
                                                value="{{col.1}}"
                                                id="col_{{col.1}}"
                                                checked
                                            >
                                            {{ col.0 }}</label>
                                    </label>
                                </div>
                            </div>
                        {% endfor %}
                        {% for col in hidden_columns %}
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <div class="oh-input-group">
                                    <label class="oh-label">
                                        <label for="col_{{col.1}}"><input
                                                type="checkbox"
                                                data-label="{{col.0}}"
                                                name="selected_fields"
                                                value="{{col.1}}"
                                                id="col_{{col.1}}"
                                            >
                                            {{ col.0 }}</label>
                                    </label>
                                </div>
                            </div>
                        {% endfor %}
                        <input
                            type="text"
                            hidden
                            name="export_fields"
                            value="{{export_fields}}"
                        >
                        {% for col in export_fields %}
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <div class="oh-input-group">
                                    <label class="oh-label">
                                        <label for="col_{{col.1}}"><input
                                                type="checkbox"
                                                data-label="{{col.0}}"
                                                name="selected_fields"
                                                value="{{col.1}}"
                                                id="col_{{col.1}}"
                                            >
                                            {{ col.0 }}</label>
                                    </label>
                                </div>
                            </div>
                        {% endfor %}
                    </div>

                    <div class="oh-modal__dialog-footer p-0 mt-3">
                        <button
                            onclick="$(this)
                  .closest('.oh-modal--show')
                  .removeClass('oh-modal--show')"
                            type="submit"
                            class="oh-btn oh-btn--secondary oh-btn--shadow"
                        >
                            {% trans "Export" %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
