{% load i18n static %}
<div id="pipelineNav{{ rec_id }}" hx-get="{{ nav_url }}" hx-trigger="load"></div>
<div
    class="oh-checkpoint-badge mb-2"
    id="selectedInstances"
    data-ids="[]"
    data-clicked=""
    style="display: none"
>
</div>
<div
    class="oh-wrapper"
    id="pipelineTabContent{{ rec_id }}"
    hx-get="{{ content_url }}"
    hx-trigger="ohPipelineNavReady"
>
    <div class="animated-background"></div>
</div>

<script>
    (function () {
        var navEl = document.getElementById("pipelineNav{{ rec_id }}");
        var contentEl = document.getElementById("pipelineTabContent{{ rec_id }}");
        if (!navEl || !contentEl) return;
        var fired = false;
        function go() {
            if (fired) return;
            fired = true;
            htmx.trigger(contentEl, "ohPipelineNavReady");
        }
        navEl.addEventListener("htmx:afterSettle", go);
        navEl.addEventListener("htmx:responseError", go);
        setTimeout(go, 8000);
    })();
</script>

<script>
    (function () {
        var myContent = document.currentScript.closest(".oh-tabs__content");
        var contents = myContent && myContent.closest(".oh-tabs__contents");
        if (!contents) return;
        var tabsRoot = contents.closest("#pipelineContainer") || contents.parentElement;
        contents.querySelectorAll(".oh-tabs__content").forEach(function (el) {
            if (el === myContent || !el.innerHTML.trim()) return;
            el.innerHTML = "";
            var btn = tabsRoot && tabsRoot.querySelector('[data-target="#' + el.id + '"]');
            if (btn) btn.removeAttribute("data-loaded");
        });
    })();
</script>
