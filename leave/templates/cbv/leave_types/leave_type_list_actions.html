{% load i18n %}
<div class="flex items-center justify-center gap-1" onclick="event.stopPropagation()">
    {% if perms.leave.change_leavetype and perms.leave.add_availableleave %}
        {% if compensatory %}
            <a
                href="#"
                hx-get="{% url 'type-update' instance.id %}?compensatory=True"
                data-toggle="oh-modal-toggle"
                data-target="#objectUpdateModal"
                hx-target="#objectUpdateModalTarget"
                class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
                title="{% trans 'Update' %}"
            >
                <ion-icon name="create-outline"></ion-icon>
            </a>
        {% else %}
            <a
                href="#"
                hx-get="{% url 'type-update' instance.id %}"
                data-toggle="oh-modal-toggle"
                data-target="#objectUpdateModal"
                hx-target="#objectUpdateModalTarget"
                class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
                title="{% trans 'Update' %}"
            >
                <ion-icon name="create-outline"></ion-icon>
            </a>
        {% endif %}
    {% endif %}

    {% if perms.leave.delete_leavetype and perms.leave.add_availableleave %}
        <a
            hx-get="{% url 'generic-delete' %}?model=leave.LeaveType&pk={{instance.id}}"
            hx-target="#deleteConfirmationBody"
            data-toggle="oh-modal-toggle"
            data-target="#deleteConfirmation"
            class="oh-btn oh-btn--danger oh-btn--sq-sm"
            title="{% trans 'Delete' %}"
        >
            <ion-icon name="trash-outline"></ion-icon>
        </a>
    {% endif %}

    {% if not instance.is_compensatory_leave %}
        <a
            data-toggle="oh-modal-toggle"
            data-target="#genericModal"
            hx-get="{% url 'assign-one' instance.id %}"
            hx-target="#genericModalBody"
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm text-success"
            title="{% trans 'Assign' %}"
        >
            <ion-icon name="checkmark-done-outline"></ion-icon>
        </a>
    {% else %}
        <a
            tabindex="-1"
            aria-disabled="true"
            title="{% trans 'Assign' %}"
            class="oh-btn oh-btn--light-bkg oh-btn--disabled oh-btn--sq-sm text-success"
        >
            <ion-icon name="checkmark-done-outline"></ion-icon>
        </a>
    {% endif %}
</div>
