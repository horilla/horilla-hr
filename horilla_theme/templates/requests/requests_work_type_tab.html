{% load i18n static %}

<div class="oh-inner-sidebar-content border border-[#ebebeb] rounded-md mb-5">
    <div hx-get="{% url 'work-nav-view' %}{% if request.GET %}?{{ request.GET.urlencode }}{% endif %}" hx-trigger="load"></div>

    <p class="text-xs text-gray-500 mt-1 ml-2">
        {% trans "Submit and manage requests to change your work type assignment." %}
    </p>

    <div
        class="oh-checkpoint-badge mb-2"
        id="selectedInstances"
        data-ids="[]"
        data-clicked=""
        style="display: none"
    >
    </div>

    <div class="oh-wrapper" id="listContainer">
    </div>

    <div class="oh-activity-sidebar" id="worktypeactivitySidebar" style="z-index: 1000">
        <div class="oh-activity-sidebar__body" id="commentContainer"></div>
    </div>
</div>

<script src="{% static 'cbv/work_type_request/work_request_bulk_action.js' %}"></script>
