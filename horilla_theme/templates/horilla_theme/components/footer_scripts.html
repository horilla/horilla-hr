{% load static i18n horillafilters %}
{% comment %} <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> {% endcomment %}
{% comment %} <script src="{% static 'build/js/web.frontend.min.js' %}"></script> {% endcomment %}
<script src="{% url 'javascript-catalog' %}"></script>

<script src="{% static 'htmx/htmx.min.js' %}"></script>
<script>
    document.body.addEventListener('htmx:configRequest', (event) => {
      event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}'
      if (event.detail.elt && event.detail.elt.closest && event.detail.elt.closest('[hx-push-url]')) {
        event.detail.headers['HX-Push-Nav'] = 'true'
      }
    })
</script>
<script src="{% static '/index/index.js' %}?v=38"></script>
<script src="{% static '/index/saveFilters.js' %}"></script>
<script src="{% static 'horilla_theme/assets/js/htmxSelect2.js' %}?v=11"></script>
<script src="{% static 'src/js/componentForm.js' %}?v=1"></script>
<script src="{% static 'build/js/summernote-lite.min.js' %}"></script>
<script>
    $.summernote.options.dialogsInBody = true;
    $.summernote.options.colorButton = { foreColor: '#000000', backColor: '#FFFFFF' };
</script>
<script src="{% static '/index/country.js' %}"></script>

<!-- This CDN is for date format change -->
<script src="{% static 'build/js/moment.js' %}"></script>
<script src="{% static 'cdn/ajax/scripts/moment-with-locales.min.js' %}"></script>

<script src="{% static '/base/date_settings.js' %}"></script>
<script src="{% static '/base/time_formatting.js' %}"></script>
<script src="{% static '/base/time_settings.js' %}"></script>
<script src="{% static '/base/date_formatting.js' %}"></script>

<script src="{% static 'build/js/pivottable.min.js' %}"></script>
<script src="{% static 'build/js/pivottable_plot.min.js' %}"></script>
<script src="{% static 'build/js/pivottable_ploty.min.js' %}"></script>
<script src="{% static 'build/js/pivottable_excel.min.js' %}"></script>
<script src="{% static 'build/js/vendor/jspdf.umd.min.js' %}"></script>
<script src="{% static 'build/js/vendor/jspdf.plugin.autotable.min.js' %}"></script>
{% if 'attendance'|app_installed %}
    <script src="{% static 'attendance/actions.js' %}"></script>
{% endif %}
<script type="module" src="{% static 'images/ionicons/ui_icons/ionicons/ionicons.esm.js' %}"></script>
<script src="{% static '/build/js/sweetAlert.js' %}"></script>
<script>
    // Clear all query parameters from the URL
    function clearQueryParameters() {
      var urlWithoutQuery = window.location.origin + window.location.pathname
      window.history.replaceState({}, document.title, urlWithoutQuery)
    }
</script>
<script src="{% static 'horilla_theme/assets/js/footerScripts.js' %}?v=2"></script>

<!-- Product tour engine (horilla_tour) -->
{% if request.user.is_authenticated %}
<script>
  window.HORILLA_TOUR = {
    page: "{{ request.resolver_match.url_name|default:'' }}",
    path: "{{ request.path|escapejs }}",
    activeUrl: "{% url 'tour-active' %}",
    progressUrl: "{% url 'tour-progress' %}"
  };
</script>
<script src="{% static 'build/js/tourController.js' %}?v=1"></script>
{% endif %}

{% block footer_scripts %}
{% endblock %}
