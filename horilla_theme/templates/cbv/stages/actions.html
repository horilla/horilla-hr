{% load i18n %}
<div class="flex items-center justify-center gap-1" onclick="event.stopPropagation();">
  {% if perms.recruitment.change_stage %}
    <a
      hx-get="{% url 'rec-stage-duplicate' instance.id %}"
      hx-target="#genericModalBody"
      data-toggle="oh-modal-toggle"
      data-target="#genericModal"
      class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
      title="{% trans 'Duplicate' %}"
    >
      <ion-icon name="copy-outline"></ion-icon>
    </a>
  {% endif %}
  {% if perms.recruitment.change_stage %}
    <a
      hx-get="{% url 'rec-stage-update' instance.id %}?instance_ids={{instance.ordered_ids}}"
      hx-target="#genericModalBody"
      data-toggle="oh-modal-toggle"
      data-target="#genericModal"
      class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
      title="{% trans 'Edit' %}"
    >
      <ion-icon name="create-outline"></ion-icon>
    </a>
  {% endif %}
  {% if perms.recruitment.delete_stage %}
  <form
    hx-post="{% url 'rec-stage-delete' instance.id %}"
    hx-swap="none"
    hx-confirm="{% trans 'Are you sure you want to delete this stage?' %}"
    hx-on::after-request="if(event.detail.successful){$('#applyFilter').click();$('#reloadMessagesButton').click();}"
  >
    {% csrf_token %}
    <button
      type="submit"
      class="oh-btn oh-btn--danger oh-btn--sq-sm"
      title="{% trans 'Delete' %}"
    >
      <ion-icon name="trash-outline"></ion-icon>
    </button>
  </form>
  {% endif %}
</div>
