{% load i18n static %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>{% block title %}{% trans "Survey" %}{% endblock %}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicons/favicon-32x32.png' %}">
    <script src="{% static 'htmx/htmx.min.js' %}"></script>
    <style>
        :root { --sv-primary: #e54f38; --sv-text: #111827; --sv-muted: #6b7280; --sv-line: #e5e7eb; --sv-bg: #f4f5f7; --sv-danger: #b91c1c; --sv-danger-bg: #fee2e2; --sv-ok: #15803d; --sv-ok-bg: #dcfce7; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--sv-bg); color: var(--sv-text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .sv-main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
        .sv-card { background: #fff; border: 1px solid var(--sv-line); border-radius: 16px; padding: 24px; }
        .sv-card + .sv-card { margin-top: 16px; }
        .sv-card--error { border-color: var(--sv-danger); }
        .sv-card--center { text-align: center; padding: 40px 24px; }
        .sv-title { margin: 0 0 8px; font-size: 24px; font-weight: 700; }
        .sv-desc { margin: 0; color: var(--sv-muted); white-space: pre-line; font-size: 14px; }
        .sv-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; font-size: 12px; color: var(--sv-muted); }
        .sv-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-weight: 600; background: #f3f4f6; color: var(--sv-text); }
        .sv-pill--ok { background: var(--sv-ok-bg); color: var(--sv-ok); }
        .sv-pill--req { background: var(--sv-danger-bg); color: var(--sv-danger); font-size: 11px; flex-shrink: 0; }
        .sv-bar { position: sticky; top: 0; z-index: 5; margin: 0 -16px; padding: 8px 16px; background: rgba(244,245,247,.95); backdrop-filter: blur(4px); display: flex; justify-content: space-between; font-size: 12px; color: var(--sv-muted); }
        .sv-alert { background: var(--sv-danger-bg); color: var(--sv-danger); border-radius: 12px; padding: 12px 16px; font-size: 14px; margin: 12px 0; }
        .sv-q { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
        .sv-q label { font-weight: 600; font-size: 15px; }
        .sv-q .sv-num { color: var(--sv-muted); margin-right: 4px; }
        .sv-input, .sv-textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--sv-line); border-radius: 10px; font: inherit; color: inherit; background: #fff; }
        .sv-input:focus, .sv-textarea:focus { outline: 0; border-color: var(--sv-primary); }
        .sv-input--short { max-width: 260px; }
        .sv-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .sv-chip { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: 1px solid var(--sv-line); border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; user-select: none; transition: .15s; }
        .sv-chip:hover { border-color: var(--sv-primary); }
        .sv-chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
        .sv-chip:has(input:checked) { background: var(--sv-primary); border-color: var(--sv-primary); color: #fff; }
        .sv-chip--sq { width: 44px; height: 44px; justify-content: center; padding: 0; font-weight: 600; }
        .sv-hint { margin: 8px 0 0; font-size: 12px; color: var(--sv-muted); }
        .sv-err { margin: 8px 0 0; font-size: 12px; font-weight: 600; color: var(--sv-danger); }
        .sv-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 24px; }
        .sv-btn { background: var(--sv-primary); color: #fff; border: 0; border-radius: 10px; padding: 12px 24px; font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(229,79,56,.25); }
        .sv-btn:hover { filter: brightness(.95); }
        .sv-big { font-size: 42px; margin-bottom: 10px; }
        .sv-big--ok { color: var(--sv-ok); } .sv-big--muted { color: var(--sv-muted); }
        @media (prefers-color-scheme: dark) {
            :root { --sv-text: #e5e7eb; --sv-muted: #9ca3af; --sv-line: #374151; --sv-bg: #0b0f19; }
            .sv-card, .sv-input, .sv-textarea { background: #111827; }
            .sv-pill { background: #1f2937; color: var(--sv-text); }
            .sv-bar { background: rgba(11,15,25,.92); }
        }
    </style>
</head>
<body>
    <main class="sv-main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
