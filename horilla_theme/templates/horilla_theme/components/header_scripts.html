<style>
    /* Legacy (non-Tailwind) primary CTA button — used by most Save/Create
       forms across the app. Recolor it to follow the selected company
       theme, same as the Tailwind 'brand'/'primary' color below. */
    .oh-btn--secondary,
    .oh-btn--secondary:disabled {
        background-color: {{ theme_obj.primary_600|default:"#3535C8" }} !important;
    }
    .oh-btn--secondary:hover,
    .oh-btn--secondary:focus,
    .oh-btn--secondary:focus-visible {
        background-color: {{ theme_obj.primary_700|default:"#2E3192" }} !important;
    }
    .oh-btn--secondary-outline,
    .oh-btn--secondary-link {
        color: {{ theme_obj.primary_600|default:"#3535C8" }} !important;
    }
    .oh-btn--secondary-outline:hover,
    .oh-btn--secondary-outline:focus,
    .oh-btn--secondary-outline:focus-visible,
    .oh-btn--secondary-link:hover,
    .oh-btn--secondary-link:focus,
    .oh-btn--secondary-link:focus-visible {
        color: {{ theme_obj.primary_700|default:"#2E3192" }} !important;
    }

    /* Active-filter chip bar ("Filters:" label + each filter's remove-X,
       e.g. "Is active: Yes"). Follow the selected company theme too. */
    .oh-titlebar__tag--custom {
        background-color: {{ theme_obj.primary_600|default:"#3535C8" }} !important;
    }
    .oh-titlebar__tag-close {
        background-color: {{ theme_obj.primary_600|default:"#3535C8" }} !important;
    }
    .oh-titlebar__tag-close:hover {
        background-color: {{ theme_obj.primary_700|default:"#2E3192" }} !important;
    }
    .oh-titlebar__tag.filter-field {
        border-color: {{ theme_obj.primary_600|default:"#3535C8" }} !important;
    }

    /* "Save And Add Another" — secondary CTA next to Save on create forms.
       Uses a lighter tint of the theme color so it stays visually distinct
       from the solid "Save" button while still following the theme. */
    .oh-btn--add-another {
        background-color: {{ theme_obj.primary_500|default:"#C8C8FF" }} !important;
        color: #ffffff !important;
        border: 1px solid {{ theme_obj.primary_500|default:"#C8C8FF" }} !important;
    }
    .oh-btn--add-another:hover,
    .oh-btn--add-another:focus,
    .oh-btn--add-another:focus-visible {
        background-color: {{ theme_obj.primary_600|default:"#3535C8" }} !important;
        border-color: {{ theme_obj.primary_600|default:"#3535C8" }} !important;
    }

    /* Checkmark bullet on "Changes" list items (e.g. Employee > History tab). */
    .list-checked li:before {
        color: {{ theme_obj.primary_600|default:"#3535C8" }} !important;
    }

    /* Legacy light icon button (e.g. the "View Comment" icon on Shift/Work
       Type/Document request lists). Icon color follows the theme too. */
    .oh-btn--light {
        color: {{ theme_obj.primary_600|default:"#3535C8" }} !important;
    }
    .oh-btn--light:hover,
    .oh-btn--light:focus,
    .oh-btn--light:focus-visible {
        color: {{ theme_obj.primary_700|default:"#2E3192" }} !important;
    }

    /* Tab pills inside "custom" modal dialogs (e.g. leave Allocation). The
       plain, unscoped .oh-general__tab-link--active rule in v1_styles.css
       already follows the theme via index.html's remap, but this selector's
       extra .oh-modal__dialog--custom .oh-general__tab ancestor prefix gives
       it higher specificity, so its own hardcoded #3535C8 always wins over
       that remap regardless of load order. */
    .oh-modal__dialog--custom .oh-general__tab .oh-general__tab-link--active {
        background-color: {{ theme_obj.primary_600|default:"#3535C8" }} !important;
        border-color: {{ theme_obj.primary_600|default:"#3535C8" }} !important;
    }
</style>
<script>
    document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("themeToggleButton");
    if (!btn) return;

    btn.addEventListener("click", function (e) {
        e.preventDefault();

        fetch("{% url 'toggle_theme' %}", {
        method: "POST",
        headers: {
            "X-CSRFToken": "{{ csrf_token }}",
            "X-Requested-With": "XMLHttpRequest"
        }
        })
        .then(response => {
        if (response.status === 204) {
            // Since server stored the new theme, we just mirror it in the UI

            const isDark = document.documentElement.classList.toggle("dark");
            document.body.classList.toggle("dark", isDark);

            const icon = btn.querySelector("i");
            if (icon) {
            icon.classList.toggle("fa-moon", !isDark);
            icon.classList.toggle("fa-lightbulb", isDark);
            }
        }
        })
        .catch(err => console.error(err));
    });
    });
</script>

<script>
    // Site-wide: keep tabbed list panels (e.g. Attendance To Validate / OT /
    // Validated, Requested / All Attendances) the same size as a plain list
    // view (e.g. Employees) regardless of how many rows a given tab has.
    // Uses a single MutationObserver on <body> rather than specific htmx
    // event names, so it keeps working no matter which code path swaps the
    // content in (declarative hx-get, htmx.ajax(), a raw jQuery fallback, or
    // a full SPA page navigation that replaces #listContainer itself).
    (function () {
        var BOTTOM_MARGIN = 20; // matches the plain list view's own bottom gap
        var SELECTOR = "#listContainer .heightContainer, #listContainer .attendance-request-scroll";
        var pending = null;

        function sizeVisibleScrollContainers() {
            var containers = document.querySelectorAll(SELECTOR);
            for (var i = 0; i < containers.length; i++) {
                var container = containers[i];
                if (container.offsetParent === null) {
                    continue; // hidden (inactive tab) - leave it alone
                }
                var top = container.getBoundingClientRect().top;
                var height = window.innerHeight - top - BOTTOM_MARGIN;
                if (height > 100) {
                    container.style.maxHeight = height + "px";
                    container.style.minHeight = height + "px";
                }
            }
        }

        function scheduleResize() {
            if (pending) {
                clearTimeout(pending);
            }
            pending = setTimeout(sizeVisibleScrollContainers, 30);
        }

        window.addEventListener("resize", scheduleResize);
        document.addEventListener("DOMContentLoaded", function () {
            scheduleResize();
            if (window.MutationObserver) {
                new MutationObserver(function (mutations) {
                    for (var i = 0; i < mutations.length; i++) {
                        if (mutations[i].addedNodes.length) {
                            scheduleResize();
                            return;
                        }
                    }
                }).observe(document.body, { childList: true, subtree: true });
            }
        });
        scheduleResize();
    })();
</script>

<script>
    // Keep grouped list accordions open across HTMX reloads (nested pagination,
    // filters, etc.). List containers often get a fresh DOM node via outerHTML
    // swap, so in-memory state keyed by element id is unreliable — persist by
    // data-list-path in sessionStorage and re-apply after settle.
    (function () {
        var STORAGE_PREFIX = "hlv-open-groups:";

        function listPathFrom(el) {
            if (!el) {
                return null;
            }
            if (el.getAttribute && el.getAttribute("data-list-path")) {
                return el.getAttribute("data-list-path");
            }
            if (el.querySelector) {
                var nested = el.querySelector("[data-list-path]");
                if (nested) {
                    return nested.getAttribute("data-list-path");
                }
            }
            if (el.closest) {
                var parent = el.closest("[data-list-path]");
                if (parent) {
                    return parent.getAttribute("data-list-path");
                }
            }
            return null;
        }

        function containerForPath(path) {
            if (!path) {
                return null;
            }
            var nodes = document.querySelectorAll("[data-list-path]");
            for (var i = 0; i < nodes.length; i++) {
                if (nodes[i].getAttribute("data-list-path") === path) {
                    return nodes[i];
                }
            }
            return null;
        }

        function readStored(path) {
            try {
                return JSON.parse(sessionStorage.getItem(STORAGE_PREFIX + path) || "[]");
            } catch (e) {
                return [];
            }
        }

        function writeStored(path, indices) {
            try {
                sessionStorage.setItem(STORAGE_PREFIX + path, JSON.stringify(indices || []));
            } catch (e) {
                /* ignore quota / private mode */
            }
        }

        function openIndicesIn(container) {
            if (!container || !container.querySelectorAll) {
                return [];
            }
            return Array.prototype.map.call(
                container.querySelectorAll(
                    ".oh-accordion.oh-accordion--show > .oh-accordion-header[data-group]"
                ),
                function (header) {
                    return header.getAttribute("data-group");
                }
            );
        }

        function captureFrom(target) {
            var path = listPathFrom(target);
            var container = containerForPath(path) || target;
            if (!path || !container || !container.querySelectorAll) {
                return;
            }
            // Always persist (including []) so closing every group sticks
            // across the next reload instead of restoring a stale set.
            writeStored(path, openIndicesIn(container));
        }

        function restorePath(path) {
            var indices = readStored(path);
            if (!indices.length) {
                return;
            }
            var container = containerForPath(path);
            if (!container) {
                return;
            }
            // Prefer stored open groups over the server's default "first open".
            container.querySelectorAll(".oh-accordion.oh-accordion--show").forEach(function (el) {
                el.classList.remove("oh-accordion--show");
            });
            indices.forEach(function (idx) {
                var header = container.querySelector(
                    '.oh-accordion-header[data-group="' + idx + '"]'
                );
                if (header) {
                    var accordion = header.closest(".oh-accordion");
                    accordion.classList.add("oh-accordion--show");
                    var icon = header.querySelector("ion-icon.icon");
                    if (icon) {
                        icon.setAttribute("name", "chevron-up-outline");
                    }
                }
            });
        }

        function restoreAllKnown() {
            Object.keys(sessionStorage).forEach(function (key) {
                if (key.indexOf(STORAGE_PREFIX) === 0) {
                    restorePath(key.slice(STORAGE_PREFIX.length));
                }
            });
        }

        // Capture before the request so nested pagination / filter reloads
        // keep whichever groups were expanded.
        document.addEventListener("htmx:beforeRequest", function (evt) {
            captureFrom(evt.detail.target);
        });

        document.addEventListener("htmx:afterSettle", function (evt) {
            var path = listPathFrom(evt.detail.target) || listPathFrom(evt.target);
            if (path) {
                restorePath(path);
            } else {
                restoreAllKnown();
            }
        });

        // Persist whenever the user opens/closes a grouped-list accordion.
        // footerScripts toggles the class first; read state on the next tick.
        document.addEventListener(
            "click",
            function (evt) {
                var header = evt.target && evt.target.closest
                    ? evt.target.closest(".oh-accordion-header[data-group]")
                    : null;
                if (!header) {
                    return;
                }
                var path = listPathFrom(header);
                if (!path) {
                    return;
                }
                setTimeout(function () {
                    var container = containerForPath(path);
                    if (container) {
                        writeStored(path, openIndicesIn(container));
                    }
                }, 0);
            },
            true
        );
    })();
</script>
