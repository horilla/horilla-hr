{% load i18n %}
<div class="d-flex align-items-end pt-2" id="poc-row-{{ index }}" style="gap: 8px;">
    {% if form.instance.pk %}<input type="hidden" name="poc{{ index }}-row_id" value="{{ form.instance.pk }}">{% endif %}
    <div class="row flex-grow-1 g-2">
        <div class="col-6 col-lg-3">
            <div class="oh-input-group">
                <label class="oh-label">{{ form.designation.label }}</label>
                {{ form.designation }}
            </div>
            {{ form.designation.errors }}
        </div>
        <div class="col-6 col-lg-3">
            <div class="oh-input-group">
                <label class="oh-label">{{ form.name.label }}</label>
                {{ form.name }}
            </div>
            {{ form.name.errors }}
        </div>
        <div class="col-6 col-lg-3">
            <div class="oh-input-group">
                <label class="oh-label">{{ form.email.label }}</label>
                {{ form.email }}
            </div>
            {{ form.email.errors }}
        </div>
        <div class="col-6 col-lg-3">
            <div class="oh-input-group">
                <label class="oh-label">{{ form.mobile.label }}</label>
                {{ form.mobile }}
            </div>
            {{ form.mobile.errors }}
        </div>
    </div>
    <a
        hx-get="{% url 'company-onboarding-remove-poc-row' %}"
        class="oh-btn oh-btn--danger"
        hx-target="#poc-row-{{ index }}"
        hx-swap="outerHTML"
        title="{% trans 'Remove contact' %}"
    >
        <ion-icon name="trash-outline"></ion-icon>
    </a>
</div>
<div id="poc-row-{{ index|add:1 }}-placeholder" class="pt-2">
    <a
        hx-target="#poc-row-{{ index|add:1 }}-placeholder"
        hx-swap="outerHTML"
        hx-get="{% url 'company-onboarding-add-poc-row' %}?count={{ index }}"
        role="button"
        class="oh-btn oh-btn--x-small oh-btn--success-outline"
    >
        <ion-icon name="add-outline" class="me-1"></ion-icon>
        {% trans "Add Contact" %}
    </a>
</div>
