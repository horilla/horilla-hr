{% load i18n %}
<div class="oh-dropdown__filter-body">
    <div class="oh-accordion oh-accordion--show">
        <div class="oh-accordion-header">{% trans "Report Audit" %}</div>
        <div class="oh-accordion-body">
            <div class="row">
                <div class="col-sm-12 col-md-12 col-lg-6">
                    <div class="oh-input-group">
                        <label class="oh-label">{% trans "Action" %}</label>
                        {{ form.action }}
                    </div>
                </div>
                <div class="col-sm-12 col-md-12 col-lg-6">
                    <div class="oh-input-group">
                        <label class="oh-label">{% trans "Report slug" %}</label>
                        {{ form.report_slug }}
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-12 col-md-12 col-lg-6">
                    <div class="oh-input-group">
                        <label class="oh-label">{% trans "User" %}</label>
                        {{ form.q }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
