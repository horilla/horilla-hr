{% load static i18n %}
<div class="dropdown-content w-64 absolute z-10 bg-white rounded-lg [box-shadow:0px_0px_20px_0px_rgb(0_0_0_/_8%)] py-2 right-0">
    {% if all_companies|length > 8 %}
        <div class="px-3 pb-2 mb-1 border-b border-[#f0f0f0]">
            <div class="relative">
                <input
                    type="text"
                    class="w-full text-xs border border-[#e6e6e6] rounded-md pl-7 pr-2 py-1.5 outline-none focus:border-primary-600"
                    placeholder="{% trans 'Search company' %}"
                    onkeyup="
                        var q = this.value.toLowerCase();
                        this.closest('.dropdown-content').querySelectorAll('.company-switch-item').forEach(function (el) {
                            el.style.display = el.dataset.name.indexOf(q) > -1 ? '' : 'none';
                        });
                    "
                >
                <i class="fas fa-search absolute left-2.5 top-1/2 -translate-y-1/2 text-[10px] opacity-50"></i>
            </div>
        </div>
    {% endif %}
    <ul class="text-sm max-h-80 overflow-y-auto">
        {% for company in all_companies %}
            <li class="company-switch-item" data-name="{{ company.1|lower }}">
                <button
                    class="px-3 py-2 hover:bg-primary-100 hover:text-primary-600 transition duration-300 text-sm gap-2 items-center flex w-full text-left"
                    hx-get="{% url 'update-selected-company' %}?company_id={{company.0}}&next={{ request.path }}"
                >
                    <span class="rounded-full overflow-hidden shrink-0 w-5 h-5 flex items-center justify-center">
                        <img src="{% if company.2 and company.2 != '/404/' %}{{ company.2 }}{% else %}/static/horilla_theme/assets/img/horilla-logo.png{% endif %}" alt="" class="w-5 h-5 object-cover">
                    </span>
                    <span class="truncate flex-1">{{ company.1 }}</span>

                    {% if company.3 %}
                        <ion-icon
                            name="checkmark-circle-outline"
                            class="shrink-0"
                            style="color: green; font-size: 1.2em"
                        ></ion-icon>
                    {% endif %}

                    {% if not company_selected and request.user.employee_get.employee_work_info.company_id.id == company.0 %}
                        <ion-icon
                            name="checkmark-circle-outline"
                            class="shrink-0"
                            style="color: green; font-size: 1.2em"
                        ></ion-icon>
                    {% endif %}
                </button>
            </li>
            {% if forloop.first %}
                <li class="border-b border-[#f0f0f0] my-1"></li>
            {% endif %}
        {% endfor %}
    </ul>
</div>
