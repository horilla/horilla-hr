
{% load i18n %}
<div class=" {% if instance.status == 'rejected' %} diff-cell{% endif %}" onclick="event.stopPropagation()">
    <div class="flex items-center justify-center gap-1">
        {% if instance.status == 'approved' and instance.end_date >= current_date and not instance.cancellation_requested %}
            <a data-toggle="oh-modal-toggle"
                data-target="#cancelModal"
                hx-get="{% url 'user-request-cancel' instance.id %}"
                hx-target="#cancelForm"
                title="{% trans 'Cancel' %}"
                class="oh-btn oh-btn--danger oh-btn--sq-sm">
                <ion-icon name="close-circle-outline"></ion-icon>
            </a>
        {% else %}
            <button class="oh-btn oh-btn--danger opacity-50 cursor-not-allowed oh-btn--sq-sm" title="{% if instance.cancellation_requested %}{% trans 'Cancellation already requested' %}{% else %}{% trans 'Cancel' %}{% endif %}" disabled>
                <ion-icon name="close-circle-outline"></ion-icon>
            </button>
        {% endif %}
        {% if instance.status == 'requested'%}
            <button class="oh-btn oh-btn--light-bkg oh-btn--sq-sm" title="{% trans 'Edit' %}" data-toggle="oh-modal-toggle"
                data-target="#genericModal" hx-get="{% url 'user-request-update' instance.id %}?instance_ids={{instance.ordered_ids}}"
                hx-target="#genericModalBody">
                <ion-icon name="create-outline"></ion-icon>
            </button>
            <a class="oh-btn oh-btn--danger oh-btn--sq-sm"
                title="{% trans 'Delete' %}" id="delete-link"
                hx-confirm="{% trans 'Are you sure you want to delete this leave request?' %}"
                hx-post="{% url 'user-request-delete' instance.id %}"
                hx-target="#deleteleavedata"
                >
                <ion-icon name="trash-outline"></ion-icon>
            </a>
        {% else %}
            <button
                class="oh-btn oh-btn--light-bkg oh-btn--sq-sm" title="{% trans 'Edit' %}" disabled>
                <ion-icon name="create-outline" ></ion-icon>
            </button>
            <button class="oh-btn oh-btn--danger opacity-50 cursor-not-allowed oh-btn--sq-sm" title="{% trans 'Delete' %}" disabled>
                <ion-icon name="trash-outline"></ion-icon>
            </button>
        {% endif %}
    </div>
</div>
