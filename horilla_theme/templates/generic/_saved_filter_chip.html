{% load i18n %}
<div
    class="relative group oh-hover-btn__main flex flex-shrink-0 justify-between items-center transition duration-300 bg-white hover:bg-primary-100 hover:border-primary-600 rounded-md"
    hx-get="{{ request.path }}?{{ filter.urlencode }}"
    hx-target="#{{ root_view_id|default:view_id|safe }}"
    hx-swap="outerHTML"
>
    <!-- Filter Button -->
    <button
        hx-get="{% url 'last-applied-filter' %}?{{ filter.urlencode }}"
        hx-swap="none"
        class="px-4 py-2 text-xs flex gap-2 items-center whitespace-nowrap group-hover:text-primary-600"
    >
        <span class="h-3 w-3 rounded-full flex" style="background-color: {{ filter.color }}"></span>
        {{ filter.title }}
    </button>

    <!-- Edit/Delete Drawer (appears on hover or always visible depending on your design) -->
    <div
        class="relative top-0 right-0 hidden group-hover:flex transition duration-300 gap-1 p-1 rounded z-10"
        onclick="event.stopPropagation()"
    >
        <!-- Edit -->
        <button
            class="oh-hover-btn__small"
            onclick="$('#savedFilterModal').addClass('oh-modal--show')"
            hx-get="{% url 'saved-filter-update' filter.id %}"
            hx-target="#SavedFilterFormTarget"
            hx-swap="innerHTML"
        >
            <ion-icon name="create-outline"></ion-icon>
        </button>

        <!-- Delete -->
        <button
            class="oh-hover-btn__small"
            onclick="$(this).parent().find('button:hidden').click();"
        >
            <ion-icon name="trash-outline"></ion-icon>
        </button>

        <!-- Hidden Delete Trigger. Removing the chip's own DOM node client-side
        (the old approach) left the "Quick filter (N)" count stale, since that count
        is only ever rendered once from the server - reload the whole view
        instead so the chip list and its count both come from the same
        authoritative render. -->
        <button
            hidden
            hx-get="{% url 'delete-saved-filter' filter.id %}"
            hx-swap="none"
            hx-on::after-request="if(event.detail.successful){$('#{{ root_view_id|default:view_id|safe }} .reload-record').click();}"
        ></button>
    </div>
</div>
