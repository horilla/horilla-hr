{% load i18n %}
<div>
	<div class="flex items-center justify-center gap-1">
		{% if perms.payroll.change_contract %}
			<a
				onclick="event.stopPropagation()"
				class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
				href="#"
				hx-get="{% url 'update-contract' instance.id %}"
				hx-target="#relatedObjectModalBody"
				data-toggle="oh-modal-toggle"
				data-target="#relatedObjectModal"
				title="{% trans 'Update' %}"
			>
				<ion-icon
					name="create-outline"
					role="img"
					class="md hydrated"
					aria-label="{% trans 'create outline' %}"
				></ion-icon>
			</a>
		{% else %}
			<button class="oh-btn oh-btn--light-bkg oh-btn--sq-sm" disabled title="{% trans 'Update' %}">
				<ion-icon name="create-outline"></ion-icon>
			</button>
		{% endif %}
		{% if perms.payroll.delete_contract and instance.contract_status == "draft" %}
			<a
				onclick="event.preventDefault();event.stopPropagation();"
				class="oh-btn oh-btn--danger oh-btn--sq-sm"
				hx-confirm="{% trans 'Do you want to delete this Contract?' %}"
				hx-post="{% url 'delete-contract' instance.id %}?{{pd}}"
				hx-target="#contract-container"
				hx-swap="innerHTML"
				title="{% trans 'Delete' %}"
			>
				<ion-icon
					name="trash-outline"
					role="img"
					class="md hydrated"
					aria-label="{% trans 'trash outline' %}"
				></ion-icon>
			</a>
		{% else %}
			<button
				type="button"
				class="oh-btn oh-btn--danger oh-btn--sq-sm"
				disabled
				style="opacity: 0.5; cursor: not-allowed;"
				title="{% trans 'Only a draft contract can be deleted' %}"
			>
				<ion-icon name="trash-outline"></ion-icon>
			</button>
		{% endif %}
	</div>
</div>
