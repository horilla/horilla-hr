{% extends "index.html" %}
{% load i18n %}
{% block content %}
    <style>
        .note-modal-backdrop {
            z-index: 998 !important;
        }

        .tooltip {
            display: inline-block; /* Ensures that the tooltip container doesn't stretch to the full width */
            position: relative;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            z-index: 1;
            position: absolute;
            bottom: 5%;
            left: 50%;
            width: auto; /* Allow the tooltip width to adjust based on content */
            max-width: auto; /* Limit the maximum width of the tooltip to prevent it from overflowing */
            padding: 5px;
            overflow: hidden; /* Hides any overflowed content */
            transform: translateX(5%);
            border-radius: 6px;
            background-color: green;
            color: white;
            font-size: 15px;
            text-align: center;
            white-space: nowrap; /* Prevents the text from wrapping */
            opacity: 0;
            transition: opacity 0.3s;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>

    {% include "generic/components.html" %}

    <div class="oh-wrapper">
        <div hx-get="{% url 'cbv-pipeline-nav' %}" hx-trigger="load"></div>
        <div id="pipelineContainer" class="bg-white p-3 rounded-md shadow-card oh-tabs">
            <div id="pipelineTabStrip"></div>
            <div id="pipelinePanes" class="oh-tabs__contents"></div>
        </div>
    </div>
    <div class="oh-activity-sidebar" id="activitySidebar" style="z-index: 1000">
        <div class="oh-activity-sidebar__body" id="noteContainer">
            <div class="oh-activity-sidebar__header">
                <a
                    event.stopPropagation
                    style="cursor: pointer"
                    onclick="$('.oh-activity-sidebar--show').removeClass('oh-activity-sidebar--show')"
                >
                    <ion-icon
                        name="chevron-forward-outline"
                        class="oh-activity-sidebar__header-icon me-2 oh-activity-sidebar__close"
                        data-target="#activitySidebar"
                    >
                    </ion-icon>
                </a>
            </div>
        </div>
    </div>

    <div
        class="oh-modal"
        id="bulkResumeUpload"
        role="dialog"
        aria-labelledby="bulkResumeUpload"
        aria-hidden="true"
    >
        <div class="oh-modal__dialog">
            <div class="oh-modal__dialog-header">
                <h2 class="oh-modal__dialog-title" id="bulkResumeUploadLabel">
                    {% trans "Upload Resumes" %}
                </h2>
                <p class="text-sm text-[#64748B] mt-1 mb-0">
                    {% trans "Review, score and manage the resumes uploaded for this recruitment." %}
                </p>
                <button class="oh-modal__close" aria-label="{% trans 'Close' %}">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
            </div>
            <div class="oh-modal__dialog-body !pt-4" id="bulkResumeUploadBody">
                <div class="flex flex-col items-center justify-center gap-2 py-10" role="status">
                    <div class="h-7 w-7 animate-spin rounded-full border-[3px] border-dark-50 border-t-primary-600"></div>
                    <p class="text-sm text-[#666] mb-0">{% trans "Loading..." %}</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.bulkResumeLoaderHtml = window.bulkResumeLoaderHtml || document.getElementById("bulkResumeUploadBody").innerHTML;
        document.removeEventListener("htmx:beforeRequest", window.bulkResumeLoaderListener);
        window.bulkResumeLoaderListener = function (event) {
        	var body = document.getElementById("bulkResumeUploadBody");
        	if (body && event.detail.target === body && !body.contains(event.detail.elt)) {
        		body.innerHTML = window.bulkResumeLoaderHtml;
        	}
        };
        document.addEventListener("htmx:beforeRequest", window.bulkResumeLoaderListener);

        function pipelineOpenTab(btn) {
        	const $btn = $(btn);
        	const paneId = $btn.attr("data-target").slice(1);
        	const $panes = $("#pipelinePanes");
        	let pane = document.getElementById(paneId);
        	if (!pane) {
        		pane = $('<div class="oh-tabs__content"></div>').attr("id", paneId).appendTo($panes)[0];
        	}
        	$("#pipelineTabStrip .oh-tabs__tab").removeClass("oh-tabs__tab--active");
        	$btn.addClass("oh-tabs__tab--active");
        	$panes.children(".oh-tabs__content").removeClass("oh-tabs__content--active");
        	$(pane).addClass("oh-tabs__content--active");

        	document.dispatchEvent(new CustomEvent("oh:tab-switched", {
        		detail: { tabUrl: $btn.attr("data-tab-url"), target: "#" + paneId }
        	}));
        	$.ajax({
        		type: "get",
        		url: "{% url 'active-tab' %}",
        		data: {
        			path: $btn.attr("data-path"),
        			target: `[data-tab-index="${$btn.attr("data-tab-index")}"]`,
        		},
        	});
        	if (typeof clearSelectionsOnTabSwitch === "function") {
        		clearSelectionsOnTabSwitch("pipelineContainer");
        	}

        	if (!$btn.attr("data-loaded") || !pane.innerHTML.trim()) {
        		const url = $btn.attr("data-tab-url");
        		btn.setAttribute("data-loaded", "true");
        		const req = htmx.ajax("GET", url, { target: "#" + paneId, source: btn });
        		if (req && typeof req.catch === "function") {
        			req.catch(function () {
        				btn.removeAttribute("data-loaded");
        				if (typeof renderLoadFailure === "function") {
        					renderLoadFailure("#" + paneId, null, "pipelineOpenTab(document.querySelector('#pipelineTabStrip [data-target=\"#" + paneId + "\"]'));");
        				}
        			});
        		}
        	}
        }

        function pipelineTabsRendered(savedSelector) {
        	const $buttons = $("#pipelineTabStrip .oh-tabs__tab");
        	const $panes = $("#pipelinePanes");
        	const currentId = $panes.children(".oh-tabs__content--active").attr("id");

        	$panes.children(".oh-tabs__content").each(function () {
        		if (!$buttons.filter(`[data-target="#${this.id}"]`).length) {
        			$(this).remove();
        		}
        	});
        	if (!$buttons.length) return;

        	const $current = currentId ? $buttons.filter(`[data-target="#${currentId}"]`) : $();
        	if ($current.length) {
        		const board = document.getElementById("pipelineTabContent" + $current.attr("data-rec-id"));
        		if (!board) {
        			pipelineOpenTab($current[0]);
        			return;
        		}
        		$buttons.removeClass("oh-tabs__tab--active");
        		$current.addClass("oh-tabs__tab--active").attr("data-loaded", "true");
        		if (typeof clearSelectionsOnTabSwitch === "function") {
        			clearSelectionsOnTabSwitch("pipelineContainer");
        		}
        		htmx.trigger(board, "htmx:abort");
        		htmx.ajax("GET", $current.attr("data-content-url"), { target: board, source: board });
        		return;
        	}

        	let $next = $();
        	if (!currentId && savedSelector) {
        		$next = $buttons.filter(savedSelector).first();
        	}
        	if (!$next.length) {
        		$next = $buttons.first();
        	}
        	pipelineOpenTab($next[0]);
        }

        function archiveCandidate(url, msg) {
        	Swal.fire({
        		text: msg,
        		icon: "question",
        		showCancelButton: true,
        		confirmButtonColor: "#d33",
        		cancelButtonColor: "#6c757d",
        		confirmButtonText: i18nMessages.confirm,
        	}).then((result) => {
        		if (result.isConfirmed) {
        			window.location.href = url;
        		}
        	});
        }

        function getCSRFToken() {
        	const metaToken = document.querySelector('meta[name="csrf-token"]');
        	if (metaToken && metaToken.getAttribute("content")) {
        		return metaToken.getAttribute("content");
        	}
        	const tokenPair = document.cookie
        		.split("; ")
        		.find((row) => row.startsWith("csrftoken="));
        	return tokenPair ? decodeURIComponent(tokenPair.split("=")[1]) : "";
        }

        function deleteCandidate(url) {
        	Swal.fire({
        		text: "{% trans 'Do you want to delete this candidate?'|escapejs %}",
        		icon: "question",
        		showCancelButton: true,
        		confirmButtonColor: "#d33",
        		cancelButtonColor: "#6c757d",
        		confirmButtonText: i18nMessages.confirm,
        	}).then((result) => {
        		if (result.isConfirmed) {
        			const form = document.createElement("form");
        			form.setAttribute("action", url);
        			form.setAttribute("method", "post");

        			const csrfTokenInput = document.createElement("input");
        			csrfTokenInput.setAttribute("type", "hidden");
        			csrfTokenInput.setAttribute("name", "csrfmiddlewaretoken");
        			csrfTokenInput.value = getCSRFToken();
        			form.appendChild(csrfTokenInput);

        			document.body.appendChild(form);
        			form.submit();
        		}
        	});
        }
    </script>
{% endblock content %}
