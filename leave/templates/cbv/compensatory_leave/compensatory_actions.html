{% load i18n %}
<div class="flex items-center justify-center gap-1" onclick="event.stopPropagation()">
    {% if instance.status ==  'requested' %}
        <button
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
            title="{% trans 'Edit' %}"
            data-toggle="oh-modal-toggle"
            data-target="#genericModal"
            hx-get="{% url 'update-compensatory-leave' instance.id %}?instance_ids={{instance.ordered_ids}}"
            hx-target="#genericModalBody">
            <ion-icon name="create-outline"></ion-icon>
        </button>
    {% else %}
        <button
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm" disabled>
            <ion-icon name="create-outline" ></ion-icon>
        </button>
    {% endif %}
    {% if instance.status !=  'approved' %}
        <a class="oh-btn oh-btn--danger oh-btn--sq-sm" id="delete-link"
            hx-confirm="{% trans 'Are you sure you want to delete ?' %}"
            hx-post="{% url 'delete-compensatory-leave' instance.id %}"
            hx-target="#listContainer"
            title="{% trans 'Delete' %}">
            <ion-icon name="trash-outline"></ion-icon>
        </a>
    {% else %}
        <button class="oh-btn oh-btn--danger oh-btn--sq-sm opacity-50 cursor-not-allowed" disabled>
            <ion-icon name="trash-outline"></ion-icon>
        </button>
    {% endif %}
</div>
