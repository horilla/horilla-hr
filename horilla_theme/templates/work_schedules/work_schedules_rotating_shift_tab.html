{% load i18n static %}

<div class="border border-[#ebebeb] rounded-md mb-5">
    <div hx-get="{% url 'rotating-shift-request-nav' %}" hx-trigger="load"></div>

    <div
        class="oh-checkpoint-badge mb-2"
        id="selectedInstances"
        data-ids="[]"
        data-clicked=""
        style="display: none"
    >
    </div>

    <div class="oh-wrapper" id="listContainer">
    </div>

    <div class="oh-activity-sidebar" id="activitySidebar" style="z-index: 1000">
        <div class="oh-activity-sidebar__body" id="commentContainer"></div>
    </div>

    <div class="oh-modal" id="shiftImport" role="dialog" aria-labelledby="shiftImport" aria-hidden="true">
        <div class="oh-modal__dialog">
            <div class="oh-modal__dialog-header">
                <h2 class="oh-modal__dialog-title" id="shiftImportLavel">{% trans "Import Rotating Shift" %}</h2>
                <button class="oh-modal__close" aria-label="{% trans 'Close' %}">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
                <div class="oh-modal__dialog-body p-0 pt-2" id="shiftImportModalBody">
                    <form action="#" id="shiftImportForm" enctype="multipart/form-data">
                        <div id="uploading" class="oh-upload-loader" role="status" aria-live="polite">
                            <p class="oh-upload-loader__title">{% trans "Uploading..." %}</p>
                            <p class="oh-upload-loader__hint">{% trans "Don't refresh the page" %}</p>
                            <div class="oh-upload-loader__bar"><span></span></div>
                        </div>

                        <div id="error-container" style="color: red"></div>

                        <div class="modal-body">
                            {% csrf_token %}
                            <div class="oh-dropdown__import-form">
                                <label class="oh-dropdown__import-label" for="shiftImportFile">
                                    <ion-icon
                                        name="cloud-upload"
                                        class="oh-dropdown__import-form-icon md hydrated"
                                        role="img"
                                        aria-label="{% trans 'cloud upload' %}"
                                    ></ion-icon>
                                    <span class="oh-dropdown__import-form-title">{% trans "Upload a File" %}</span>
                                    <span
                                        class="oh-dropdown__import-form-text"
                                    >{% trans "Drag and drop files here" %}</span>
                                </label>
                                <input type="file" name="file" id="shiftImportFile">
                                <div class="d-inline float-end">
                                    <a
                                        href="#"
                                        style="text-decoration: none; display: inline-block"
                                        class="oh-dropdown__link"
                                        onclick="template_download(event)"
                                        data-toggle="oh-modal-toggle"
                                        data-target="#shiftImport"
                                    >
                                        <ion-icon
                                            name="cloud-download-outline"
                                            style="font-size: 20px; vertical-align: middle"
                                        ></ion-icon>
                                        <span>{% trans "Download Template" %}</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer d-flex flex-row-reverse">
                            <input
                                type="submit"
                                class="oh-btn oh-btn--small oh-btn--secondary w-100 mt-3"
                                value="{% trans 'Upload' %}"
                            >
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'cbv/shift_request/shift_request_bulk_actions.js' %}?v=2"></script>
<script src="{% static 'basedOn.js' %}"></script>
<script>
    $(document).ready(function () {
        $("#id_field").on("change", function () {
            $(".filterButton")[0].click();
        });

        var form = $("#shiftImportForm");
        form.on("submit", function () {
            event.preventDefault();
            $(".oh-dropdown__import-form").css("display", "none");
            $("#uploading").addClass("htmx-request");
            var formData = new FormData();
            var fileInput = document.querySelector("#shiftImportFile");
            formData.append("file", fileInput.files[0]);

            $.ajax({
                type: "POST",
                url: "{% url 'rotating-shift-assign-info-import' %}",
                dataType: "binary",
                data: formData,
                processData: false,
                contentType: false,
                timeout: 600000,
                headers: {
                    "X-CSRFToken": getCookie("csrftoken"),
                    "HX-Request": "true",
                },
                xhrFields: {
                    responseType: "blob",
                },
                error: function () {
                    resetShiftImportForm();
                    Swal.fire({
                        text: "{% trans 'The import failed. Please try again.'|escapejs %}",
                        icon: "error",
                    });
                },
                success: function (response, textStatus, xhr) {
                    var errorCount = xhr.getResponseHeader("X-Error-Count");
                    if (typeof response === "object" && response.type == "application/json") {
                        var reader = new FileReader();
                        reader.onload = function () {
                            var json = JSON.parse(reader.result);
                            if (json.success_count > 0) {
                                Swal.fire({
                                    text: json.success_count + " {% trans 'Employees Imported Successfully'|escapejs %}",
                                    icon: "success",
                                    showConfirmButton: false,
                                    timer: 3000,
                                    timerProgressBar: true,
                                }).then(function () {
                                    window.location.reload();
                                });
                            } else {
                                resetShiftImportForm();
                                Swal.fire({
                                    text: "{% trans 'No employees were imported. Please check the file and try again.'|escapejs %}",
                                    icon: "warning",
                                });
                            }
                        };
                        reader.readAsText(response);
                        return;
                    }
                    if (!$(".file-xlsx-validation").length) {
                        swal.fire({
                            text: "{% trans 'You have'|escapejs %} " + errorCount + " {% trans 'errors. Do you want to download the error list?'|escapejs %}",
                            icon: "error",
                            showCancelButton: true,
                            showDenyButton: true,
                            confirmButtonText: "{% trans 'Download error list & Continue Import'|escapejs %}",
                            denyButtonText: "{% trans 'Download error list & Skip Import'|escapejs %}",
                            cancelButtonText: i18nMessages.cancel,
                            confirmButtonColor: "#008000",
                            denyButtonColor: "#475569",
                            cancelButtonColor: "#d33",
                            customClass: {
                                container: "custom-swal-container",
                                popup: "oh-swal-stack",
                            },
                        }).then((result) => {
                            if (result.isDenied) {
                                const file = new Blob([response], { type: "text/csv" });
                                const url = URL.createObjectURL(file);
                                const link = document.createElement("a");
                                link.href = url;
                                link.download = "ImportError.csv";
                                document.body.appendChild(link);
                                link.click();
                                document.body.removeChild(link);
                                URL.revokeObjectURL(url);
                                link.click();
                                window.location.reload();
                            } else if (result.isConfirmed) {
                                formData.append("create_rotating_shift", true);
                                $.ajax({
                                    type: "POST",
                                    url: "{% url 'rotating-shift-assign-info-import' %}",
                                    dataType: "binary",
                                    data: formData,
                                    processData: false,
                                    contentType: false,
                                    timeout: 600000,
                                    headers: {
                                        "X-CSRFToken": getCookie("csrftoken"),
                                        "HX-Request": "true",
                                    },
                                    xhrFields: {
                                        responseType: "blob",
                                    },
                                    error: function () {
                                        resetShiftImportForm();
                                        Swal.fire({
                                            text: "{% trans 'The import failed. Please try again.'|escapejs %}",
                                            icon: "error",
                                        });
                                    },
                                    success: function () {
                                        Swal.fire({
                                            text: "{% trans 'Rotating Shifts Imported Successfully'|escapejs %}",
                                            icon: "success",
                                            showConfirmButton: false,
                                            timer: 3000,
                                            timerProgressBar: true,
                                        }).then(function () {
                                            window.location.reload();
                                        });
                                    },
                                });
                            } else {
                                resetShiftImportForm();
                            }
                        });
                    }
                },
            });
        });
    });

    function resetShiftImportForm() {
        $("#uploading").removeClass("htmx-request");
        $(".oh-dropdown__import-form").css("display", "block");
    }

    function template_download(e) {
        e.preventDefault();
        Swal.fire({
            text: i18nMessages.downloadTemplate,
            icon: "question",
            showCancelButton: true,
            confirmButtonColor: "#008000",
            cancelButtonColor: "#6c757d",
            confirmButtonText: i18nMessages.confirm,
            cancelButtonText: i18nMessages.cancel,
        }).then(function (result) {
            if (result.isConfirmed) {
                $.ajax({
                    url: "{% static 'import_templates/shift_schedule_template.csv' %}",
                    method: "GET",
                    xhrFields: {
                        responseType: "blob",
                    },
                    success: function (data) {
                        var blob = new Blob([data], { type: "text/csv" });
                        var link = $("<a>")
                            .attr("href", window.URL.createObjectURL(blob))
                            .attr("download", "shift_schedule_template.csv")
                            .appendTo("body");
                        link[0].click();
                        link.remove();
                    },
                });
            }
        });
    }
</script>
