{% extends "index.html" %}
{% block content %}
    {% load static %}
    {% load i18n %}
    {% load basefilters %}
    {% load horillafilters %}
    <style>
        .oh-not-found {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
        }
    </style>

    <div
        hx-get="{% url 'document-request-nav-cbv' %}"
        hx-trigger="load"
        class="bg-white"
        style="position: sticky; top: 75px; z-index: 30;"
    ></div>

    <div id="view-container" class="oh-wrapper">
        {% comment %} {% include 'documents/requests.html' %} {% endcomment %}
    </div>

    <div
        class="oh-modal"
        id="viewFileModal"
        role="dialog"
        aria-labelledby="viewFileModal"
        aria-hidden="true"
    >
        <div class="oh-modal__dialog" id="viewFile"></div>
    </div>
{% endblock %}
