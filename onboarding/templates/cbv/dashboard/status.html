{% load i18n %}
<style>
    .oh-recuritment_tag.todo-task {
        background-color: #f1f1f1;
        color: #666666;
    }
    .oh-recuritment_tag.scheduled-task {
        background-color: #e0f2fe;
        color: #0284c7;
    }
    .oh-recuritment_tag.ongoing-task {
        background-color: #fde68a;
        color: #b45309;
    }
    .oh-recuritment_tag.stuck-task {
        background-color: #fca5a5;
        color: #b91c1c;
    }
    .oh-recuritment_tag.done-task {
        background-color: #86efac;
        color: #15803d;
    }
</style>
<span class="oh-recuritment_tag {% if instance.status %}{{ instance.status }}-task{% endif %}" data-no-tooltip>
    <select
        name="status"
        id="task_status{{ instance.id }}"
        style="width: 150px;"
        hx-get="{% url 'change-task-status' %}?task_id={{ instance.id }}"
        hx-swap="afterend"
        onchange="this.parentElement.className = 'oh-recuritment_tag ' + this.value + '-task'"
    >
        {% for status in instance.choice %}
            <option value="{{ status.0 }}" {% if status.0 == instance.status %}selected{% endif %}>{{ status.1 }}</option>
        {% endfor %}
    </select>
</span>
