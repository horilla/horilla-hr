{% load i18n %}{% load static %}
  <div class="oh-dropdown__filter-body">
    <div class="oh-accordion{% if modern_filter %} oh-accordion--show{% endif %}">
    <div class="oh-accordion-header">
      <span class="oh-filter-section-icon"><ion-icon name="briefcase-outline"></ion-icon></span>
      {% trans "Recruitment" %}
    </div>
    <div class="oh-accordion-body">
      <!-- Full width -- Managers and Company are now AJAX-searched
           Select2 comboboxes (see recruitment/filters.py's
           RecruitmentFilter.ajax_fields) and need real room for their
           selected chips/placeholder text, same reasoning as every
           other modernized panel this session. -->
      <div class="row">
        <div class="col-sm-12 col-md-12 col-lg-12">
          <div class="oh-input-group">
              <label class="oh-label">{% trans "Managers" %}</label>
              {{form.recruitment_managers}}
          </div>
        </div>
        <div class="col-sm-12 col-md-12 col-lg-12">
          <div class="oh-input-group">
            <label class="oh-label">{% trans "Company" %}</label>
            {{form.company_id}}
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-12 col-md-12 col-lg-6">
          <div class="oh-input-group">
            <label class="oh-label">{% trans "Is Closed" %}</label>
            {% comment %} {{form.closed}} {% endcomment %}
            <select name="closed" id="closed" class="oh-select oh-select-2 w-100">
              <option value="unknown">{% trans "Unknown" %}</option>
              <option value="true">{% trans "True" %}</option>
              <option value="false" selected>{% trans "False" %}</option>
            </select>
          </div>
        </div>
        <div class="col-sm-12 col-md-12 col-lg-6">
          <div class="oh-input-group">
            <label class="oh-label">{% trans "Is Published" %}</label>
            {{form.is_published}}
          </div>
        </div>
      </div>
    </div>
  </div>


  <div class="oh-accordion{% if modern_filter %} oh-accordion--show{% endif %}">
    <div class="oh-accordion-header">
      <span class="oh-filter-section-icon"><ion-icon name="options-outline"></ion-icon></span>
      {% trans "Advanced" %}
    </div>
    <div class="oh-accordion-body">
      <div class="row">
        <div class="col-sm-12 col-md-12 col-lg-6">
          <div class="oh-input-group">
            <label class="oh-label">{% trans "Start Date From" %}</label>
            {{form.start_from}}
          </div>
          <div class="oh-input-group">
            <label class="oh-label">{% trans "Is Active" %}?</label>
            {{form.is_active}}
          </div>
        </div>
        <div class="col-sm-12 col-md-12 col-lg-6">
          <div class="oh-input-group">
            <label class="oh-label">{% trans "Till End Date" %}</label>
            {{form.end_till}}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{% static '/base/filter.js' %}"></script>
