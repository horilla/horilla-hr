{% extends "index.html" %}
{% load i18n static %}

{% block content %}
    <style>
        .oh-avatar-stack {
            position: relative;
            display: inline-block;
        }
        .oh-avatar-stack__images {
            display: flex;
            align-items: center;
        }
        .oh-avatar-stack__img {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            margin-left: -10px;
            border: 2px solid #fff;
            border-radius: 50%;
            background: #596376;
            overflow: hidden;
        }
        .oh-avatar-stack__img:first-child {
            margin-left: 0;
        }
        .oh-avatar-stack__img img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .oh-avatar-stack__more {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #8c98a8;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
        }
        .oh-avatar-stack__empty {
            color: #8c98a8;
            font-size: 12px;
        }
        .oh-avatar-stack__popover-content {
            display: none;
        }
        /* Shared floating popover: a single body-level element the JS below
           repositions per hover. It has to live outside the table -- the
           cell's ancestor clips overflow, so a popover positioned inside it
           would be invisible. */
        .oh-avatar-float-popover {
            display: none;
            position: fixed;
            z-index: 9999;
            min-width: 180px;
            max-width: 240px;
            max-height: 220px;
            overflow-y: auto;
            padding: 8px;
            background: #fff;
            border: 1px solid #e4e6ea;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .12);
        }
        .oh-avatar-stack__popover-title {
            margin-bottom: 6px;
            padding: 0 4px;
            color: #8c98a8;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .oh-avatar-stack__popover-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px;
            border-radius: 6px;
        }
        .oh-avatar-stack__popover-row:hover {
            background: #f4f6f8;
        }
        .oh-avatar-stack__popover-row img {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            border-radius: 50%;
            object-fit: cover;
        }
        .oh-avatar-stack__popover-row span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
    <div class="border border-[#ebebeb] rounded-md">
        <div hx-get="{% url 'nav-objective-templates-view' %}" hx-trigger="load"></div>
        <p class="text-xs text-gray-500 mt-1 ml-3">
            {% trans "Create and manage reusable objective templates for performance cycles." %}
        </p>

        {% include "generic/components.html" %}

        <div
            class="oh-checkpoint-badge mb-2"
            id="selectedInastacesAll"
            data-ids="[]"
            data-clicked=""
            style="display: none"
        >
        </div>

        <div class="oh-wrapper" id="listContainer">
        </div>

        <script>
            $(document).on("htmx:afterSettle", function () {
                $("[data-toggle-count]")
                    .off("click")
                    .on("click", function (e) {
                        e.stopPropagation();
                        let recViewContainer = $(this).closest(".oh-sticky-table__tr");
                        span = recViewContainer.find(".count-span").toggle();
                        var row = $(this).closest(".oh-sticky-table__tr");
                        row.toggleClass("oh-permission-table--collapsed");
                    });
            });

            // Managers/Assignees avatar-stack hover popover -- see
            // cbv/objectives/objectives.html for the full explanation.
            (function () {
                var floatPop = document.getElementById("objAvatarFloatPopover");
                if (!floatPop) {
                    floatPop = document.createElement("div");
                    floatPop.id = "objAvatarFloatPopover";
                    floatPop.className = "oh-avatar-float-popover";
                    document.body.appendChild(floatPop);
                }
                var hideTimer = null;

                function showFor(stack) {
                    clearTimeout(hideTimer);
                    var src = stack.querySelector(".oh-avatar-stack__popover-content");
                    if (!src) {
                        return;
                    }
                    floatPop.innerHTML = src.innerHTML;
                    var rect = stack.getBoundingClientRect();
                    var pw = 220;
                    var left = rect.left;
                    if (left + pw > window.innerWidth - 8) {
                        left = window.innerWidth - pw - 8;
                    }
                    var top = rect.bottom + 6;
                    if (top + 220 > window.innerHeight - 8) {
                        top = rect.top - 226;
                    }
                    floatPop.style.left = left + "px";
                    floatPop.style.top = top + "px";
                    floatPop.style.display = "block";
                }

                function scheduleHide() {
                    hideTimer = setTimeout(function () {
                        floatPop.style.display = "none";
                    }, 150);
                }

                document.addEventListener("mouseover", function (e) {
                    var stack = e.target.closest && e.target.closest(".oh-avatar-stack");
                    if (stack) {
                        showFor(stack);
                    }
                });
                document.addEventListener("mouseout", function (e) {
                    var stack = e.target.closest && e.target.closest(".oh-avatar-stack");
                    var toStack = e.relatedTarget && e.relatedTarget.closest
                        ? e.relatedTarget.closest(".oh-avatar-stack")
                        : null;
                    if (stack && stack !== toStack) {
                        scheduleHide();
                    }
                });
                floatPop.addEventListener("mouseenter", function () {
                    clearTimeout(hideTimer);
                });
                floatPop.addEventListener("mouseleave", scheduleHide);
            })();
        </script>
    </div>
{% endblock content %}
