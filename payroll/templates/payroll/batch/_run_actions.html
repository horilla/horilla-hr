{% load i18n %}
{% if instance.status != "paid" %}
<form method="post" action="{% url 'payroll-batch-delete' instance.pk %}" class="w-100"
      onclick="event.stopPropagation();"
      onsubmit="return confirm('{% trans "Delete this batch and its payslips? This cannot be undone."|escapejs %}');">
  {% csrf_token %}
  <button type="submit" title="{% trans 'Delete this batch' %}"
          class="oh-btn oh-btn--danger-outline oh-btn--light-bkg w-100">
    <ion-icon name="trash-outline"></ion-icon>
  </button>
</form>
{% endif %}
